                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </div>

        {/* HØYRE PANEL */}
        <div className="flex-1 overflow-y-auto min-h-0">
          {modus === 'referat' ? (
            !valgtPubId ? (
              <div className="flex items-center justify-center h-full text-center p-8">
                <div className="space-y-2">
                  <p className="text-4xl">📜</p>
                  <p className="text-sm text-gray-500">Velg et møte til venstre for å lese referatet</p>
                  <p className="text-xs text-gray-400">Søk og partifilter gjelder innenfor lastet referat</p>
                </div>
              </div>
            ) : lastes ? (
              <div className="flex flex-col items-center justify-center h-full gap-3">
                <Spinner /><p className="text-sm text-gray-400">Laster referat…</p>
              </div>
            ) : lastFeil ? (
              <div className="p-8 text-center space-y-2">
                <p className="text-sm text-red-500">Kunne ikke laste referat</p>
                <p className="text-xs text-gray-400">{lastFeil}</p>
              </div>
            ) : lastetSaker && lastetSaker.length === 0 ? (
              <div className="p-8 text-center space-y-2">
                <p className="text-sm text-gray-400">Ingen taler funnet i dette referatet.</p>
                <p className="text-xs text-gray-300">Sjekk nettleserens konsoll for detaljer (F12).</p>
              </div>
            ) : lastetSaker ? (
              <div>
                {(søk || partiFilter !== 'alle') && (
                  <div className="sticky top-0 bg-blue-50 border-b border-blue-100 px-4 py-2 flex items-center gap-2 z-10">
                    <span className="text-xs text-blue-600">
                      {filtrerteSaker.reduce((s, sk) => s + sk.innlegg.length, 0)} innlegg vises
                    </span>
                    <button onClick={() => { setSøk(''); setPartiFilter('alle'); }}
                      className="text-xs text-blue-500 hover:text-blue-700 ml-auto">
                      Nullstill ✕
                    </button>
                  </div>
                )}
                <SakInnleggListe saker={filtrerteSaker} repsMap={repsMap} onVelgRep={onVelgRep} søk={søk} />
              </div>
            ) : null
          ) : (
            valgtRep && indeks ? (
              <TalerRepAktivitetDetalj rep={valgtRep} indeks={indeks} onVelgRep={onVelgRep} />
            ) : valgtSakId && indeks ? (
              <TalerSakAktivitetDetalj sakId={valgtSakId} indeks={indeks} onVelgRep={onVelgRep} />
            ) : (
              <div className="flex items-center justify-center h-full text-center p-8">
                <div className="space-y-2">
                  <p className="text-4xl">🎤</p>
                  <p className="text-sm text-gray-500">
                    {indeks ? 'Velg en representant eller sak til venstre' : 'Klikk "Analyser alle talere" for å bygge aktivitetsindeks'}
                  </p>
                  {indeks && <p className="text-xs text-gray-400">{indeks.repTotaler.size} representanter lastet</p>}
                </div>
              </div>
            )
          )}
        </div>
      </div>
    </div>
  );
}

// ── localStorage CRUD ────────────────────────────────────────────
const INTERN_KEY = 'stortinget_intern_v1';

const internDB = {
  hentAlle: () => {
    try { return JSON.parse(localStorage.getItem(INTERN_KEY) || '{}'); }
    catch { return {}; }
  },
  hent: (sakId) => internDB.hentAlle()[String(sakId)] || null,
  lagre: (sakId, data) => {
    const alle = internDB.hentAlle();
    alle[String(sakId)] = { ...data, sakId: String(sakId) };
    localStorage.setItem(INTERN_KEY, JSON.stringify(alle));
  },
  slett: (sakId) => {
    const alle = internDB.hentAlle();
    delete alle[String(sakId)];
    localStorage.setItem(INTERN_KEY, JSON.stringify(alle));
  },
  eksporter: () => {
    const data = localStorage.getItem(INTERN_KEY) || '{}';
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `stortinget-intern-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
  importer: (jsonText) => {
    try {
      const parsed = JSON.parse(jsonText);
      const eksisterende = internDB.hentAlle();
      localStorage.setItem(INTERN_KEY, JSON.stringify({ ...eksisterende, ...parsed }));
      return true;
    } catch { return false; }
  },
  tomSak: (sakId, sakTittel, sesjonId) => ({
    sakId:       String(sakId),
    sakTittel,
    sesjonId,
    ansvarlig:   '',
    kategori:    null,
    posisjon:    null,
    prioritet:   'normal',
    frister: {
      skriftlige_innspill: '',
      utkast_1: { dato: '', merknad: null },
      utkast_2: { dato: '', merknad: null },
      utkast_3: { dato: '', merknad: null },
      utkast_4: { dato: '', merknad: null },
      utkast_5: { dato: '', merknad: null },
      avgivelse: '',
      debatt:    '',
    },
    notat_status: null,
    instanser:    [],
    notater:      [],
    votering:     { løse: [], apiForslag: {} },
  }),
};

// ── Reaktiv hook ─────────────────────────────────────────────────
function useInternDB() {
  const [rev, setRev] = useState(0);
  const refresh = () => setRev(r => r + 1);

  const saker = useMemo(() => {
    void rev; // avhengighet for re-beregning
    return Object.values(internDB.hentAlle());
  }, [rev]);

  const oppdater = (sakId, data) => { internDB.lagre(sakId, data);  refresh(); };
  const slettSak = (sakId)       => { internDB.slett(sakId);         refresh(); };

  return { saker, oppdater, slettSak, refresh };
}

// ── LeggTilSakModal ───────────────────────────────────────────────
function LeggTilSakModal({ sesjonId, internSaker, onLeggTil, onLukk }) {
  const { data: sakerData, loading } = useData(() => API.saker(sesjonId), [sesjonId]);
  const alleSaker  = useMemo(() => parse.saker(sakerData), [sakerData]);
  const [søk, setSøk] = useState('');

  const internIds = useMemo(
    () => new Set(internSaker.map(s => String(s.sakId))),
    [internSaker]
  );

  const filtrert = useMemo(() => {
    if (!søk.trim()) return alleSaker.slice(0, 50);
    const q = søk.toLowerCase();
    return alleSaker.filter(s =>
      (s.tittel      || '').toLowerCase().includes(q) ||
      (s.korttittel  || '').toLowerCase().includes(q) ||
      String(s.id).includes(q)
    ).slice(0, 80);
  }, [alleSaker, søk]);

  // Lukk på Escape
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onLukk(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onLukk]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center"
      style={{ background: 'rgba(0,0,0,0.45)' }}
      onClick={e => { if (e.target === e.currentTarget) onLukk(); }}>
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl mx-4 flex flex-col"
        style={{ maxHeight: '80vh' }}>

        {/* Header */}
        <div className="flex items-center justify-between px-4 py-3 border-b">
          <h2 className="font-semibold text-gray-900">Legg til sak</h2>
          <button onClick={onLukk} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>

        {/* Søk */}
        <div className="px-4 py-3 border-b">
          <input autoFocus value={søk} onChange={e => setSøk(e.target.value)}
            placeholder="Søk på tittel eller saksnummer…"
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
        </div>

        {/* Sakliste */}
        <div className="flex-1 overflow-y-auto">
          {loading && <Spinner />}
          {!loading && filtrert.length === 0 && <TomtResultat tekst="Ingen saker funnet" />}
          {filtrert.map(s => {
            const erLagtTil = internIds.has(String(s.id));
            return (
              <button key={s.id} disabled={erLagtTil}
                onClick={() => { onLeggTil(s); onLukk(); }}
                className={`w-full text-left px-4 py-3 border-b border-gray-50 hover:bg-blue-50 transition-colors flex items-start gap-3
                  ${erLagtTil ? 'opacity-50 cursor-not-allowed' : ''}`}>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium text-gray-900 line-clamp-2">{s.tittel || s.korttittel}</p>
                  <p className="text-xs text-gray-400 mt-0.5">
                    Sak {s.id} · {SAK_TYPE_MAP[s.type] || 'Sak'}
                  </p>
                </div>
                {erLagtTil && <span className="text-xs text-green-600 font-medium shrink-0 mt-0.5">Lagt til</span>}
              </button>
            );
          })}
        </div>

        {/* Footer */}
        <div className="px-4 py-2 border-t bg-gray-50 text-xs text-gray-400">
          {søk
            ? `${filtrert.length} treff`
            : `Viser ${filtrert.length} av ${alleSaker.length} saker · søk for å filtrere`}
        </div>
      </div>
    </div>
  );
}

// ── InternSakKort ─────────────────────────────────────────────────
function InternSakKort({ sak, valgt, onClick }) {
  const kat = sak.kategori ? INTERN_KATEGORI[sak.kategori] : null;
  const pos = sak.posisjon ? INTERN_POSISJON[sak.posisjon] : null;
  const pri = INTERN_PRIORITET[sak.prioritet] || INTERN_PRIORITET.normal;

  return (
    <button onClick={onClick}
      className={`w-full text-left px-3 py-2.5 border-b border-gray-100 transition-colors hover:bg-blue-50
        ${valgt ? 'bg-blue-50 border-l-2 border-l-blue-500' : ''}`}>
      <div className="flex items-start gap-2">
        <span className="mt-1.5 w-2 h-2 rounded-full shrink-0"
          style={{ background: pri.farge }} title={`Prioritet: ${pri.label}`} />
        <div className="flex-1 min-w-0">
          <p className="text-sm font-medium text-gray-900 line-clamp-2 leading-tight">{sak.sakTittel}</p>
          <div className="flex items-center gap-1.5 mt-1 flex-wrap">
            {sak.sesjonId && <span className="text-[11px] text-gray-400">{sak.sesjonId}</span>}
            {kat && (
              <span className="text-[11px] font-semibold px-1 rounded"
                style={{ background: `${kat.farge}22`, color: kat.farge }}>
                {sak.kategori}
              </span>
            )}
            {pos && (
              <span className="text-[11px] font-medium" style={{ color: pos.farge }}>
                {pos.label}
              </span>
            )}
            {sak.ansvarlig && (
              <span className="text-[11px] text-gray-500 truncate">
                {sak.ansvarlig.split(' ')[0]}
              </span>
            )}
          </div>
        </div>
      </div>
    </button>
  );
}

// ── InternSakListe ────────────────────────────────────────────────
function InternSakListe({ saker, valgtSakId, sesjonId, onVelg, onLeggTil, onSlett, refresh }) {
  const [søk,        setSøk]        = useState('');
  const [katFilter,  setKatFilter]  = useState('alle');
  const [priFilter,  setPriFilter]  = useState('alle');
  const [visModal,   setVisModal]   = useState(false);
  const [importFeil, setImportFeil] = useState(null);
  const filRef = useRef(null);

  const filtrert = useMemo(() => {
    let res = [...saker];
    if (søk.trim()) {
      const q = søk.toLowerCase();
      res = res.filter(s =>
        (s.sakTittel  || '').toLowerCase().includes(q) ||
        (s.ansvarlig  || '').toLowerCase().includes(q) ||
        String(s.sakId).includes(q)
      );
    }
    if (katFilter !== 'alle') res = res.filter(s => s.kategori  === katFilter);
    if (priFilter !== 'alle') res = res.filter(s => s.prioritet === priFilter);
    const priOrd = { høy: 0, normal: 1, lav: 2 };
    return res.sort((a, b) =>
      (priOrd[a.prioritet] ?? 1) - (priOrd[b.prioritet] ?? 1) ||
      (a.sakTittel || '').localeCompare(b.sakTittel || '', 'nb')
    );
  }, [saker, søk, katFilter, priFilter]);

  const handleImport = (e) => {
    const fil = e.target.files?.[0];
    if (!fil) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const ok = internDB.importer(ev.target.result);
      if (ok) { refresh(); setImportFeil(null); }
      else setImportFeil('Ugyldig fil – kunne ikke importere');
    };
    reader.readAsText(fil);
    e.target.value = '';
  };

  return (
    <div className="w-64 shrink-0 border-r border-gray-200 flex flex-col bg-white h-full">
      {/* Topp */}
      <div className="px-3 py-2.5 border-b border-gray-200">
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs font-semibold text-gray-500 uppercase tracking-wide">
            Interne saker
          </span>
          <button onClick={() => setVisModal(true)} title="Legg til sak"
            className="w-6 h-6 rounded bg-blue-600 text-white text-sm font-bold flex items-center justify-center hover:bg-blue-700">
            +
          </button>
        </div>
        <input value={søk} onChange={e => setSøk(e.target.value)}
          placeholder="Søk i saker…"
          className="w-full text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-300 mb-2" />
        <div className="flex gap-1.5">
          <select value={katFilter} onChange={e => setKatFilter(e.target.value)}
            className="flex-1 text-xs border border-gray-200 rounded px-1.5 py-1 focus:outline-none bg-white">
            <option value="alle">Alle kat.</option>
            {Object.entries(INTERN_KATEGORI).map(([k]) => (
              <option key={k} value={k}>Kat. {k}</option>
            ))}
          </select>
          <select value={priFilter} onChange={e => setPriFilter(e.target.value)}
            className="flex-1 text-xs border border-gray-200 rounded px-1.5 py-1 focus:outline-none bg-white">
            <option value="alle">Alle pri.</option>
            {Object.entries(INTERN_PRIORITET).map(([k, v]) => (
              <option key={k} value={k}>{v.label}</option>
            ))}
          </select>
        </div>
      </div>

      {/* Liste */}
      <div className="flex-1 overflow-y-auto">
        {filtrert.length === 0 && (
          <p className="text-xs text-gray-400 p-4 text-center">
            {saker.length === 0 ? 'Ingen saker lagt til ennå' : 'Ingen treff'}
          </p>
        )}
        {filtrert.map(s => (
          <InternSakKort key={s.sakId} sak={s} valgt={valgtSakId === s.sakId} onClick={() => onVelg(s)} />
        ))}
      </div>

      {/* Bunn: eksport/import */}
      <div className="px-3 py-2 border-t border-gray-100">
        <div className="flex gap-1.5">
          <button onClick={internDB.eksporter}
            className="flex-1 text-xs py-1.5 rounded border border-gray-200 text-gray-600 hover:bg-gray-50">
            Eksporter
          </button>
          <button onClick={() => filRef.current?.click()}
            className="flex-1 text-xs py-1.5 rounded border border-gray-200 text-gray-600 hover:bg-gray-50">
            Importer
          </button>
          <input ref={filRef} type="file" accept=".json" className="hidden" onChange={handleImport} />
        </div>
        {importFeil && <p className="text-xs text-red-500 mt-1">{importFeil}</p>}
      </div>

      {/* Modal */}
      {visModal && (
        <LeggTilSakModal
          sesjonId={sesjonId}
          internSaker={saker}
          onLeggTil={s => onLeggTil(internDB.tomSak(s.id, s.tittel || s.korttittel, sesjonId))}
          onLukk={() => setVisModal(false)}
        />
      )}
    </div>
  );
}

// ── Hjelpere for frister ─────────────────────────────────────────
function FristDot({ dato }) {
  if (!dato) return <span className="w-2.5 h-2.5 rounded-full bg-gray-200 shrink-0" title="Ikke satt" />;
  const dager = Math.ceil((new Date(dato) - new Date()) / 86400000);
  let farge = '#22c55e';
  if (dager < 0)      farge = '#ef4444';
  else if (dager < 7) farge = '#f59e0b';
  const tittel = dager < 0
    ? `Passert (${Math.abs(dager)} dager siden)`
    : `${dager} dager igjen`;
  return <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: farge }} title={tittel} />;
}

function DagerTil({ dato }) {
  if (!dato) return null;
  const dager = Math.ceil((new Date(dato) - new Date()) / 86400000);
  let cls = 'text-green-600';
  const tekst = dager < 0 ? `${Math.abs(dager)}d siden` : `${dager}d`;
  if (dager < 0)      cls = 'text-red-500';
  else if (dager < 7) cls = 'text-yellow-600';
  return <span className={`text-[11px] font-medium tabular-nums ${cls}`}>{tekst}</span>;
}

const MERKNAD_VERDIER = [
  { id: null,           label: '—'            },
  { id: 'ikke_merknad', label: 'Ikke merknad' },
  { id: 'påbegynt',     label: 'Påbegynt'     },
  { id: 'innlevert',    label: 'Innlevert'    },
];

// ── InternFristerFane ─────────────────────────────────────────────
function InternFristerFane({ sak, oppdater }) {
  const frister = sak.frister || {};

  const oppdaterDato = (faseId, verdi) => {
    const fase = UTKAST_FASER.find(f => f.id === faseId);
    const nyeFrister = { ...frister };
    if (fase?.hasMerknad) {
      nyeFrister[faseId] = { ...(nyeFrister[faseId] || {}), dato: verdi };
    } else {
      nyeFrister[faseId] = verdi;
    }
    oppdater(sak.sakId, { ...sak, frister: nyeFrister });
  };

  const oppdaterMerknad = (faseId, merknad) => {
    const nyeFrister = { ...frister };
    nyeFrister[faseId] = { ...(nyeFrister[faseId] || {}), merknad };
    oppdater(sak.sakId, { ...sak, frister: nyeFrister });
  };

  // Neste frist som ikke er passert (for oppsummering)
  const nesteFrist = useMemo(() => {
    const iDag = new Date();
    for (const fase of UTKAST_FASER) {
      const raw  = frister[fase.id];
      const dato = fase.hasMerknad ? (raw?.dato || '') : (raw || '');
      if (dato && new Date(dato) >= iDag) return { label: fase.alias || fase.label, dato };
    }
    return null;
  }, [frister]);

  return (
    <div className="p-5 max-w-2xl">
      {nesteFrist && (
        <div className="mb-4 px-3 py-2 rounded-lg bg-blue-50 border border-blue-100 text-sm text-blue-700">
          Neste frist: <span className="font-semibold">{nesteFrist.label}</span>
          {' – '}{new Date(nesteFrist.dato).toLocaleDateString('nb-NO', { day: 'numeric', month: 'long' })}
        </div>
      )}

      <div className="border border-gray-200 rounded-xl overflow-hidden divide-y divide-gray-100">
        {UTKAST_FASER.map(fase => {
          const raw     = frister[fase.id];
          const dato    = fase.hasMerknad ? (raw?.dato || '') : (raw || '');
          const merknad = fase.hasMerknad ? (raw?.merknad ?? null) : null;

          return (
            <div key={fase.id} className="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
              <FristDot dato={dato} />
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium text-gray-800">
                  {fase.label}
                  {fase.alias && (
                    <span className="ml-1.5 text-[11px] text-gray-400">({fase.alias})</span>
                  )}
                </p>
                {fase.hasMerknad && (
                  <div className="flex gap-1.5 mt-1 flex-wrap">
                    {MERKNAD_VERDIER.map(mv => (
                      <button key={String(mv.id)} onMouseDown={e => { e.preventDefault(); oppdaterMerknad(fase.id, mv.id); }}
                        className={`text-[11px] px-2 py-0.5 rounded-full border transition-colors
                          ${merknad === mv.id
                            ? 'bg-blue-600 text-white border-blue-600'
                            : 'border-gray-200 text-gray-500 hover:bg-gray-100'}`}>
                        {mv.label}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <DagerTil dato={dato} />
              <input type="date" value={dato} onChange={e => oppdaterDato(fase.id, e.target.value)}
                className="text-xs border border-gray-200 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-300 w-36" />
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── InternOversiktFane ────────────────────────────────────────────
function InternOversiktFane({ sak, oppdater }) {
  const [ansvarlig,       setAnsvarlig]       = useState(sak.ansvarlig || '');
  const [forslagListe,    setForslagListe]    = useState([]);
  const [visForslagListe, setVisForslagListe] = useState(false);

  const { data: repsData } = useData(() => API.dagensRepresentanter(), []);
  const navnListe = useMemo(() => {
    const reps = parse.representanter(repsData);
    return reps.map(r => [r.fornavn, r.etternavn].filter(Boolean).join(' ')).sort();
  }, [repsData]);

  // Synkroniser lokal ansvarlig-state med ny sak
  useEffect(() => { setAnsvarlig(sak.ansvarlig || ''); }, [sak.sakId]);

  const oppdaterFelt = (felt, verdi) => oppdater(sak.sakId, { ...sak, [felt]: verdi });

  const filtrerForslag = (v) => {
    setAnsvarlig(v);
    if (v.trim().length < 2) { setForslagListe([]); setVisForslagListe(false); return; }
    const q = v.toLowerCase();
    setForslagListe(navnListe.filter(n => n.toLowerCase().includes(q)).slice(0, 8));
    setVisForslagListe(true);
  };

  const velgNavn = (navn) => {
    setAnsvarlig(navn);
    setForslagListe([]);
    setVisForslagListe(false);
    oppdaterFelt('ansvarlig', navn);
  };

  // Behandlingsinstanser
  const instanser = sak.instanser || [];

  const leggTilInstans = () => oppdater(sak.sakId, {
    ...sak,
    instanser: [...instanser, { id: String(Date.now()), type: 'FM', dato: '', avgjort: false }],
  });

  const oppdaterInstans = (idx, felt, verdi) => {
    const ny = instanser.map((ins, i) => i === idx ? { ...ins, [felt]: verdi } : ins);
    oppdater(sak.sakId, { ...sak, instanser: ny });
  };

  const slettInstans = (idx) =>
    oppdater(sak.sakId, { ...sak, instanser: instanser.filter((_, i) => i !== idx) });

  return (
    <div className="p-5 space-y-6 max-w-2xl">

      {/* Ansvarlig (autocomplete) */}
      <div>
        <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
          Ansvarlig saksordfører
        </label>
        <div className="relative">
          <input value={ansvarlig} onChange={e => filtrerForslag(e.target.value)}
            onFocus={() => ansvarlig.length >= 2 && setVisForslagListe(true)}
            onBlur={() => { setTimeout(() => setVisForslagListe(false), 150); oppdaterFelt('ansvarlig', ansvarlig); }}
            placeholder="Søk på navn…"
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
          {visForslagListe && forslagListe.length > 0 && (
            <div className="absolute z-20 top-full left-0 right-0 bg-white border border-gray-200 rounded-lg shadow-lg mt-0.5 overflow-hidden">
              {forslagListe.map(n => (
                <button key={n} onMouseDown={() => velgNavn(n)}
                  className="w-full text-left px-3 py-2 text-sm hover:bg-blue-50 border-b border-gray-50 last:border-0">
                  {n}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Kategori + Posisjon + Prioritet */}
      <div className="grid grid-cols-3 gap-4">
        {/* Kategori */}
        <div>
          <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Kategori</label>
          <div className="flex flex-col gap-1">
            <button onClick={() => oppdaterFelt('kategori', null)}
              className={`px-2.5 py-1.5 rounded text-xs font-medium border transition-colors text-left
                ${!sak.kategori
                  ? 'bg-gray-100 border-gray-300 text-gray-700'
                  : 'border-gray-200 text-gray-400 hover:bg-gray-50'}`}>
              Ikke satt
            </button>
            {Object.entries(INTERN_KATEGORI).map(([k, v]) => (
              <button key={k} onClick={() => oppdaterFelt('kategori', k)}
                className={`px-2.5 py-1.5 rounded text-xs font-medium border transition-colors text-left
                  ${sak.kategori === k ? 'text-white border-transparent' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                style={sak.kategori === k ? { background: v.farge } : {}}>
                {v.label}
              </button>
            ))}
          </div>
        </div>

        {/* Posisjon */}
        <div>
          <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Posisjon</label>
          <div className="flex flex-col gap-1">
            <button onClick={() => oppdaterFelt('posisjon', null)}
              className={`px-2.5 py-1.5 rounded text-xs font-medium border transition-colors text-left
                ${!sak.posisjon
                  ? 'bg-gray-100 border-gray-300 text-gray-700'
                  : 'border-gray-200 text-gray-400 hover:bg-gray-50'}`}>
              Ikke satt
            </button>
            {Object.entries(INTERN_POSISJON).map(([k, v]) => (
              <button key={k} onClick={() => oppdaterFelt('posisjon', k)}
                className={`px-2.5 py-1.5 rounded text-xs font-medium border transition-colors text-left
                  ${sak.posisjon === k ? 'text-white border-transparent' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                style={sak.posisjon === k ? { background: v.farge } : {}}>
                {v.label}
              </button>
            ))}
          </div>
        </div>

        {/* Prioritet */}
        <div>
          <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Prioritet</label>
          <div className="flex flex-col gap-1">
            {Object.entries(INTERN_PRIORITET).map(([k, v]) => (
              <button key={k} onClick={() => oppdaterFelt('prioritet', k)}
                className={`px-2.5 py-1.5 rounded text-xs font-medium border transition-colors text-left
                  ${sak.prioritet === k ? 'text-white border-transparent' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                style={sak.prioritet === k ? { background: v.farge } : {}}>
                {v.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Notatstatus */}
      <div>
        <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Notatstatus</label>
        <div className="flex gap-2 flex-wrap">
          <button onClick={() => oppdaterFelt('notat_status', null)}
            className={`px-3 py-1.5 rounded-full text-xs font-medium border transition-colors
              ${!sak.notat_status
                ? 'bg-gray-100 border-gray-300 text-gray-700'
                : 'border-gray-200 text-gray-400 hover:bg-gray-50'}`}>
            Ikke satt
          </button>
          {Object.entries(INTERN_NOTAT_STATUS).map(([k, v]) => (
            <button key={k} onClick={() => oppdaterFelt('notat_status', k)}
              className={`px-3 py-1.5 rounded-full text-xs font-medium border transition-colors
                ${sak.notat_status === k ? 'text-white border-transparent' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}
              style={sak.notat_status === k ? { background: v.farge } : {}}>
              {v.label}
            </button>
          ))}
        </div>
      </div>

      {/* Behandlingsinstanser */}
      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Behandlingsinstanser</label>
          <button onClick={leggTilInstans} className="text-xs text-blue-600 hover:text-blue-800 font-medium">
            + Legg til
          </button>
        </div>
        {instanser.length === 0 && (
          <p className="text-xs text-gray-400">Ingen instanser registrert ennå</p>
        )}
        <div className="space-y-2">
          {instanser.map((ins, idx) => (
            <div key={ins.id || idx} className="flex items-center gap-2 p-2.5 rounded-lg bg-gray-50 border border-gray-100">
              <select value={ins.type} onChange={e => oppdaterInstans(idx, 'type', e.target.value)}
                className="text-xs border border-gray-200 rounded px-1.5 py-1 focus:outline-none bg-white font-semibold w-14">
                <option value="FM">FM</option>
                <option value="GSM">GSM</option>
                <option value="GM">GM</option>
              </select>
              <input type="date" value={ins.dato} onChange={e => oppdaterInstans(idx, 'dato', e.target.value)}
                className="flex-1 text-xs border border-gray-200 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-300" />
              <label className="flex items-center gap-1 text-xs text-gray-600 cursor-pointer whitespace-nowrap">
                <input type="checkbox" checked={!!ins.avgjort}
                  onChange={e => oppdaterInstans(idx, 'avgjort', e.target.checked)}
                  className="rounded" />
                Avgjort
              </label>
              <button onClick={() => slettInstans(idx)} className="text-gray-400 hover:text-red-500 text-lg leading-none">&times;</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Notater ───────────────────────────────────────────────────────
const NOTAT_TYPER = [
  { id: 'internt',   label: 'Internt notat'    },
  { id: 'innspill',  label: 'Eksternt innspill' },
  { id: 'utredning', label: 'Utredning'         },
  { id: 'høring',    label: 'Høring'            },
];

function NotatKort({ notat, onOppdater, onSlett }) {
  const [ekspandert, setEkspandert] = useState(false);
  const [redigerer,  setRedigerer]  = useState(false);
  const [draft, setDraft] = useState({ ...notat });

  useEffect(() => { setDraft({ ...notat }); setRedigerer(false); }, [notat.id]);

  const typeInfo = NOTAT_TYPER.find(t => t.id === notat.type) || NOTAT_TYPER[0];

  const lagre = () => { onOppdater({ ...draft }); setRedigerer(false); setEkspandert(true); };

  if (redigerer) {
    return (
      <div className="border border-blue-200 rounded-xl bg-blue-50 p-4 space-y-3">
        <div className="flex gap-2">
          <input value={draft.tittel} onChange={e => setDraft(d => ({ ...d, tittel: e.target.value }))}
            placeholder="Tittel…"
            className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
          <select value={draft.type} onChange={e => setDraft(d => ({ ...d, type: e.target.value }))}
            className="text-xs border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none bg-white">
            {NOTAT_TYPER.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
        </div>
        <textarea value={draft.innhold} onChange={e => setDraft(d => ({ ...d, innhold: e.target.value }))}
          rows={5} placeholder="Innhold…"
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none" />
        <textarea value={draft.anbefaling} onChange={e => setDraft(d => ({ ...d, anbefaling: e.target.value }))}
          rows={2} placeholder="Anbefaling (valgfritt)…"
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none" />
        <div className="flex gap-2 justify-end">
          <button onClick={() => setRedigerer(false)}
            className="px-3 py-1.5 text-xs rounded border border-gray-200 text-gray-600 hover:bg-gray-100">
            Avbryt
          </button>
          <button onClick={lagre}
            className="px-3 py-1.5 text-xs rounded bg-blue-600 text-white hover:bg-blue-700 font-medium">
            Lagre
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="border border-gray-100 rounded-xl bg-white hover:border-gray-200 transition-colors">
      <button onClick={() => setEkspandert(e => !e)}
        className="w-full text-left px-4 py-3 flex items-center gap-2">
        <span className="text-[11px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded shrink-0">
          {typeInfo.label}
        </span>
        <span className="text-sm font-medium text-gray-800 flex-1 truncate">
          {notat.tittel || '(uten tittel)'}
        </span>
        {notat.dato && <span className="text-[11px] text-gray-400 shrink-0">{notat.dato}</span>}
        <span className="text-gray-400 text-xs ml-1">{ekspandert ? '▲' : '▼'}</span>
      </button>
      {ekspandert && (
        <div className="px-4 pb-4 space-y-3">
          {notat.innhold && (
            <p className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{notat.innhold}</p>
          )}
          {notat.anbefaling && (
            <div className="rounded-lg bg-green-50 border border-green-100 px-3 py-2">
              <p className="text-xs font-semibold text-green-700 mb-0.5">Anbefaling</p>
              <p className="text-sm text-green-800 whitespace-pre-wrap">{notat.anbefaling}</p>
            </div>
          )}
          <div className="flex gap-3 justify-end pt-1">
            <button onClick={() => setRedigerer(true)}
              className="text-xs text-blue-600 hover:text-blue-800 font-medium">
              Rediger
            </button>
            <button onClick={() => { if (window.confirm('Slette dette notatet?')) onSlett(notat.id); }}
              className="text-xs text-red-400 hover:text-red-600">
              Slett
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function InternNotatFane({ sak, oppdater }) {
  const notater = sak.notater || [];
  const [leggerTil, setLeggerTil] = useState(false);
  const [nytt, setNytt] = useState({ tittel: '', type: 'internt', innhold: '', anbefaling: '' });

  const leggTil = () => {
    if (!nytt.innhold.trim() && !nytt.tittel.trim()) return;
    const notat = { ...nytt, id: String(Date.now()), dato: new Date().toISOString().slice(0, 10) };
    oppdater(sak.sakId, { ...sak, notater: [notat, ...notater] });
    setNytt({ tittel: '', type: 'internt', innhold: '', anbefaling: '' });
    setLeggerTil(false);
  };

  const oppdaterNotat = (id, data) =>
    oppdater(sak.sakId, { ...sak, notater: notater.map(n => n.id === id ? { ...n, ...data } : n) });

  const slettNotat = (id) =>
    oppdater(sak.sakId, { ...sak, notater: notater.filter(n => n.id !== id) });

  return (
    <div className="p-5 max-w-2xl space-y-4">
      {leggerTil ? (
        <div className="border border-blue-200 rounded-xl bg-blue-50 p-4 space-y-3">
          <div className="flex gap-2">
            <input value={nytt.tittel} onChange={e => setNytt(n => ({ ...n, tittel: e.target.value }))}
              autoFocus placeholder="Tittel…"
              className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
            <select value={nytt.type} onChange={e => setNytt(n => ({ ...n, type: e.target.value }))}
              className="text-xs border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none bg-white">
              {NOTAT_TYPER.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </div>
          <textarea value={nytt.innhold} onChange={e => setNytt(n => ({ ...n, innhold: e.target.value }))}
            rows={5} placeholder="Innhold…"
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none" />
          <textarea value={nytt.anbefaling} onChange={e => setNytt(n => ({ ...n, anbefaling: e.target.value }))}
            rows={2} placeholder="Anbefaling (valgfritt)…"
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none" />
          <div className="flex gap-2 justify-end">
            <button onClick={() => { setLeggerTil(false); setNytt({ tittel: '', type: 'internt', innhold: '', anbefaling: '' }); }}
              className="px-3 py-1.5 text-xs rounded border border-gray-200 text-gray-600 hover:bg-gray-100">
              Avbryt
            </button>
            <button onClick={leggTil}
              className="px-3 py-1.5 text-xs rounded bg-blue-600 text-white hover:bg-blue-700 font-medium">
              Legg til notat
            </button>
          </div>
        </div>
      ) : (
        <button onClick={() => setLeggerTil(true)}
          className="w-full border-2 border-dashed border-gray-200 rounded-xl py-3 text-sm text-gray-400 hover:border-blue-300 hover:text-blue-500 transition-colors">
          + Nytt notat
        </button>
      )}

      {notater.length === 0 && !leggerTil && (
        <p className="text-sm text-gray-400 text-center py-4">Ingen notater ennå</p>
      )}
      <div className="space-y-2">
        {notater.map(n => (
          <NotatKort key={n.id} notat={n}
            onOppdater={data => oppdaterNotat(n.id, data)}
            onSlett={slettNotat} />
        ))}
      </div>
    </div>
  );
}

// ── Voteringsforslag ──────────────────────────────────────────────
const LØST_FORSLAG_TYPER = [
  { id: 'flertall',   label: 'Flertallsforslag',   farge: '#22c55e' },
  { id: 'mindretall', label: 'Mindretallsforslag',  farge: '#3b82f6' },
];

function InternVoteringFane({ sak, oppdater }) {
  const løse = sak.votering?.løse || [];

  const [nyttTekst,      setNyttTekst]      = useState('');
  const [nyttType,       setNyttType]       = useState('flertall');
  const [nyttAnbef,      setNyttAnbef]      = useState('');
  const [leggerTil,      setLeggerTil]      = useState(false);
  const [voteringer,     setVoteringer]     = useState(null);
  const [lasterVot,      setLasterVot]      = useState(false);
  const [apiForslag,     setApiForslag]     = useState({});
  const [lasterForslag,  setLasterForslag]  = useState({});

  const leggTilLøst = () => {
    if (!nyttTekst.trim()) return;
    const f = { id: String(Date.now()), tekst: nyttTekst, type: nyttType, anbefaling: nyttAnbef };
    oppdater(sak.sakId, { ...sak, votering: { ...sak.votering, løse: [...løse, f] } });
    setNyttTekst(''); setNyttAnbef(''); setNyttType('flertall'); setLeggerTil(false);
  };

  const slettLøst = (id) =>
    oppdater(sak.sakId, { ...sak, votering: { ...sak.votering, løse: løse.filter(f => f.id !== id) } });

  const lastVoteringer = async () => {
    setLasterVot(true);
    try { setVoteringer(parse.voteringer(await API.voteringer(sak.sakId))); }
    catch { setVoteringer([]); }
    setLasterVot(false);
  };

  const lastForslag = async (vId) => {
    setLasterForslag(p => ({ ...p, [vId]: true }));
    try { setApiForslag(p => ({ ...p, [vId]: parse.voteringsforslag(await API.voteringsforslag(vId)) })); }
    catch { setApiForslag(p => ({ ...p, [vId]: [] })); }
    setLasterForslag(p => ({ ...p, [vId]: false }));
  };

  return (
    <div className="p-5 max-w-2xl space-y-6">

      {/* ─ Egne forslag ─ */}
      <div>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Egne forslag</h3>
          <button onClick={() => setLeggerTil(l => !l)}
            className="text-xs text-blue-600 hover:text-blue-800 font-medium">
            {leggerTil ? 'Avbryt' : '+ Legg til'}
          </button>
        </div>

        {leggerTil && (
          <div className="mb-3 border border-blue-200 rounded-xl bg-blue-50 p-4 space-y-3">
            <select value={nyttType} onChange={e => setNyttType(e.target.value)}
              className="text-xs border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none bg-white">
              {LØST_FORSLAG_TYPER.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
            <textarea value={nyttTekst} onChange={e => setNyttTekst(e.target.value)}
              autoFocus rows={4} placeholder="Forslagstekst…"
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none" />
            <input value={nyttAnbef} onChange={e => setNyttAnbef(e.target.value)}
              placeholder="Intern merknad (valgfritt)"
              className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
            <div className="flex justify-end">
              <button onClick={leggTilLøst}
                className="px-3 py-1.5 text-xs rounded bg-blue-600 text-white hover:bg-blue-700 font-medium">
                Lagre forslag
              </button>
            </div>
          </div>
        )}

        {løse.length === 0 && !leggerTil && (
          <p className="text-xs text-gray-400">Ingen egne forslag registrert ennå</p>
        )}
        <div className="space-y-2">
          {løse.map(f => {
            const ti = LØST_FORSLAG_TYPER.find(t => t.id === f.type) || LØST_FORSLAG_TYPER[0];
            return (
              <div key={f.id} className="border border-gray-100 rounded-xl bg-white p-3.5">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-[11px] font-semibold px-1.5 py-0.5 rounded text-white"
                    style={{ background: ti.farge }}>{ti.label}</span>
                  <button onClick={() => slettLøst(f.id)}
                    className="ml-auto text-xs text-gray-400 hover:text-red-500">Slett</button>
                </div>
                <p className="text-sm text-gray-800 whitespace-pre-wrap">{f.tekst}</p>
                {f.anbefaling && (
                  <p className="text-xs text-gray-500 mt-2 italic">{f.anbefaling}</p>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* ─ Stortingets voteringer ─ */}
      <div>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide">
            Stortingets voteringer
          </h3>
          {!voteringer && (
            <button onClick={lastVoteringer} disabled={lasterVot}
              className="text-xs text-blue-600 hover:text-blue-800 font-medium disabled:opacity-50">
              {lasterVot ? 'Laster…' : 'Last voteringer'}
            </button>
          )}
        </div>
        {voteringer === null && (
          <p className="text-xs text-gray-400">Klikk "Last voteringer" for å hente endringsforslag fra Stortinget</p>
        )}
        {voteringer?.length === 0 && (
          <p className="text-xs text-gray-400">Ingen voteringer funnet for denne saken</p>
        )}
        {voteringer && voteringer.length > 0 && (
          <div className="space-y-3">
            {voteringer.map(v => {
              const vId = v.votering_id || v.id;
              const forslagListe = apiForslag[vId];
              const laster = lasterForslag[vId];
              return (
                <div key={vId} className="border border-gray-100 rounded-xl overflow-hidden">
                  <div className="flex items-center justify-between px-3 py-2.5 bg-gray-50">
                    <div>
                      <p className="text-xs font-medium text-gray-700">{v.betegnelse || `Votering ${vId}`}</p>
                      {v.dato && <p className="text-[11px] text-gray-400">{v.dato}</p>}
                    </div>
                    {!forslagListe && (
                      <button onClick={() => lastForslag(vId)} disabled={!!laster}
                        className="text-[11px] text-blue-600 hover:text-blue-800 font-medium disabled:opacity-50">
                        {laster ? 'Laster…' : 'Vis forslag'}
                      </button>
                    )}
                  </div>
                  {forslagListe && (
                    <div className="divide-y divide-gray-50">
                      {forslagListe.length === 0 && (
                        <p className="text-xs text-gray-400 p-3">Ingen endringsforslag</p>
                      )}
                      {forslagListe.map((f, i) => (
                        <div key={i} className="px-3 py-2.5">
                          <div className="flex items-center gap-2 mb-1.5">
                            <span className="text-[11px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded shrink-0">
                              Forslag {i + 1}
                            </span>
                            {f.parti?.id && <PartiBadge partiId={f.parti.id} partiNavn={f.parti.navn} />}
                          </div>
                          <p className="text-xs text-gray-700 line-clamp-3">
                            {stripHtml(f.forslagstekst_som_html || f.tekst || '')}
                          </p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── InternSakDetalj ───────────────────────────────────────────────
const DETALJ_FANER = [
  { id: 'oversikt', label: 'Oversikt' },
  { id: 'frister',  label: 'Frister'  },
  { id: 'notater',  label: 'Notater'  },
  { id: 'votering', label: 'Votering' },
];

function InternSakDetalj({ sak, oppdater, onSlett }) {
  const [aktivFane, setAktivFane] = useState('oversikt');

  // Bytt til oversikt når ny sak velges
  useEffect(() => { setAktivFane('oversikt'); }, [sak.sakId]);

  const kat = sak.kategori ? INTERN_KATEGORI[sak.kategori] : null;
  const pos = sak.posisjon ? INTERN_POSISJON[sak.posisjon] : null;

  return (
    <div className="flex-1 flex flex-col overflow-hidden bg-white">
      {/* Header */}
      <div className="px-6 pt-5 pb-0 border-b border-gray-200 shrink-0">
        <div className="flex items-start justify-between gap-3 mb-3">
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 mb-1 flex-wrap">
              <span className="text-xs text-gray-400">Sak {sak.sakId}</span>
              {sak.sesjonId && <span className="text-xs text-gray-400">· {sak.sesjonId}</span>}
              {kat && (
                <span className="text-[11px] font-semibold px-1.5 py-0.5 rounded"
                  style={{ background: `${kat.farge}22`, color: kat.farge }}>
                  {kat.label}
                </span>
              )}
              {pos && (
                <span className="text-[11px] font-semibold px-1.5 py-0.5 rounded text-white"
                  style={{ background: pos.farge }}>
                  {pos.label}
                </span>
              )}
            </div>
            <h2 className="text-base font-semibold text-gray-900 leading-snug">{sak.sakTittel}</h2>
            {sak.ansvarlig && (
              <p className="text-xs text-gray-500 mt-1">Ansvarlig: {sak.ansvarlig}</p>
            )}
          </div>
          <button
            onClick={() => { if (window.confirm(`Slette "${sak.sakTittel}" fra interne saker?`)) onSlett(sak.sakId); }}
            className="text-xs text-gray-400 hover:text-red-500 shrink-0 transition-colors mt-1">
            Slett
          </button>
        </div>

        {/* Fane-nav */}
        <div className="flex gap-0">
          {DETALJ_FANER.map(f => (
            <button key={f.id} onClick={() => setAktivFane(f.id)}
              className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors
                ${aktivFane === f.id
                  ? 'border-blue-600 text-blue-700'
                  : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              {f.label}
              {f.id === 'notater' && (sak.notater?.length > 0) && (
                <span className="ml-1.5 text-[10px] bg-blue-100 text-blue-600 rounded-full px-1.5 py-px">
                  {sak.notater.length}
                </span>
              )}
            </button>
          ))}
        </div>
      </div>

      {/* Fane-innhold */}
      <div className="flex-1 overflow-y-auto">
        {aktivFane === 'oversikt' && <InternOversiktFane sak={sak} oppdater={oppdater} />}
        {aktivFane === 'frister'  && <InternFristerFane  sak={sak} oppdater={oppdater} />}
        {aktivFane === 'notater'  && <InternNotatFane    sak={sak} oppdater={oppdater} />}
        {aktivFane === 'votering' && <InternVoteringFane sak={sak} oppdater={oppdater} />}
      </div>
    </div>
  );
}

// ── InternVisning ─────────────────────────────────────────────────
function InternVisning({ sesjonId }) {
  const { saker, oppdater, slettSak, refresh } = useInternDB();
  const [valgtSak, setValgtSak] = useState(null);

  // Hold valgtSak synkronisert med eventuelle oppdateringer
  useEffect(() => {
    if (valgtSak) {
      const fersk = internDB.hent(valgtSak.sakId);
      if (fersk) setValgtSak(fersk);
    }
  }, [saker]);

  const leggTilSak = (tomSak) => {
    oppdater(tomSak.sakId, tomSak);
    setValgtSak(tomSak);
  };

  const handleSlett = (sakId) => {
    slettSak(sakId);
    if (valgtSak?.sakId === sakId) setValgtSak(null);
  };

  return (
    <div className="flex h-full overflow-hidden">
      <InternSakListe
        saker={saker}
        valgtSakId={valgtSak?.sakId}
        sesjonId={sesjonId}
        onVelg={s => setValgtSak(internDB.hent(s.sakId) || s)}
        onLeggTil={leggTilSak}
        onSlett={handleSlett}
        refresh={refresh}
      />

      {/* Høyre panel */}
      {valgtSak ? (
        <InternSakDetalj
          sak={valgtSak}
          oppdater={oppdater}
          onSlett={handleSlett}
        />
      ) : (
        <div className="flex-1 flex items-center justify-center bg-gray-50">
          <div className="text-center text-gray-400">
            <div className="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center mx-auto mb-3">
              <span className="text-gray-500 font-bold text-lg">+</span>
            </div>
            <p className="text-sm font-medium text-gray-600">Velg en sak fra listen</p>
            <p className="text-xs mt-1">eller legg til en ny sak med + knappen</p>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SEKSJON 12: APP — rotnivå med navigasjon
// ═══════════════════════════════════════════════════════════════
const NAV_ITEMS = [
  { id: 'saker',           label: 'Saker & voteringer' },
  { id: 'tema',            label: 'Tema-hub'           },
  { id: 'representanter',  label: 'Representanter'     },
  { id: 'partier',         label: 'Partier'            },
  { id: 'sporsmal',        label: 'Spørsmål'           },
  { id: 'taler',           label: 'Taler'              },
  { id: 'intern',          label: 'Internt'            },
];

function App() {
  const [view,     setView]     = useState('saker');
  const [sesjonId, setSesjonId] = useState('2025-2026');

  // Jump-state for tverrvisnings-navigasjon
  const [jumpTilRep,      setJumpTilRep]      = useState(null);
  const [jumpTilSak,      setJumpTilSak]      = useState(null);
  const [jumpTilSporsmal, setJumpTilSporsmal] = useState(null);

  const { data: sesjonData } = useData(() => API.sesjoner(), []);
  const sesjoner = useMemo(() => parse.sesjoner(sesjonData), [sesjonData]);

  useEffect(() => {
    const innev = sesjonData?.innevaerende_sesjon?.id;
    if (innev) setSesjonId(innev);
  }, [sesjonData]);

  const velgSesjon = (nyId) => setSesjonId(nyId);

  // Klikk på repr. fra partiview eller tema-hub → bytt til representant-view
  const handleVelgRep = (rep) => {
    setJumpTilRep(rep);
    setView('representanter');
  };

  // Klikk på sak i tema-hub → bytt til saker-view med saken åpen
  const handleVelgSak = (sak) => {
    setJumpTilSak(sak);
    setView('saker');
  };

  // Klikk på spørsmål i tema-hub → bytt til spørsmål-view med spørsmålet åpent
  const handleVelgSporsmal = (sp) => {
    setJumpTilSporsmal(sp);
    setView('sporsmal');
  };

  return (
    <div className="h-screen flex flex-col overflow-hidden" style={{ fontFamily: 'system-ui, -apple-system, sans-serif' }}>

      {/* ── Topplinje ─────────────────────────────────────────── */}
      <header className="shrink-0 bg-white border-b border-gray-200 px-4 flex items-center gap-1 z-10 shadow-sm">
        {/* Logo */}
        <div className="flex items-center gap-2 mr-4 py-2.5">
          <div className="w-7 h-7 bg-blue-700 rounded-md flex items-center justify-center shadow-sm">
            <span className="text-white text-xs font-bold">ST</span>
          </div>
          <span className="text-sm font-semibold text-gray-900 hidden sm:block">Stortinget</span>
        </div>

        {/* Navigasjon */}
        {NAV_ITEMS.map(item => (
          <button key={item.id} onClick={() => setView(item.id)}
            className={`px-3 py-3 text-sm font-medium transition-colors border-b-2 ${
              view === item.id
                ? 'border-blue-600 text-blue-700'
                : 'border-transparent text-gray-500 hover:text-gray-800 hover:border-gray-300'
            }`}>
            {item.label}
          </button>
        ))}

        {/* Sesjonvelger */}
        {(view === 'saker' || view === 'sporsmal' || view === 'tema' || view === 'partier' || view === 'representanter') && (
          <div className="ml-auto flex items-center gap-2">
            <label className="text-xs text-gray-500 font-medium">Sesjon</label>
            <select value={sesjonId} onChange={e => velgSesjon(e.target.value)}
              className="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white">
              {sesjoner.length > 0
                ? sesjoner.map(s => <option key={s.id} value={s.id}>{s.id}</option>)
                : <option value={sesjonId}>{sesjonId}</option>
              }
            </select>
          </div>
        )}
      </header>

      {/* ── Hoved-innhold ─────────────────────────────────────── */}
      <div className="flex-1 overflow-hidden flex flex-col min-h-0">
        {view === 'saker' && (
          <div className="flex-1 overflow-y-auto min-h-0">
            <SakerVisning sesjonId={sesjonId} jumpTil={jumpTilSak} />
          </div>
        )}
        {view === 'tema'           && <TemaHubVisning         sesjonId={sesjonId} onRepKlikk={handleVelgRep} onSakKlikk={handleVelgSak} onSporsmalKlikk={handleVelgSporsmal} />}
        {view === 'representanter' && <RepresentanterVisning  sesjonId={sesjonId} jumpTil={jumpTilRep} />}
        {view === 'partier'        && <PartierVisning          sesjonId={sesjonId} onVelgRep={handleVelgRep} />}
        {view === 'sporsmal'       && <SporsmalVisning         sesjonId={sesjonId} jumpTil={jumpTilSporsmal} />}
        {view === 'taler'          && <TalerVisning            sesjonId={sesjonId} onVelgRep={handleVelgRep} />}
        {view === 'intern'         && <InternVisning           sesjonId={sesjonId} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
