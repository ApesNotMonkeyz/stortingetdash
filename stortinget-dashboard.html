// ── Oversikt-fane ────────────────────────────────────────────
function PartiOversiktFane({ parti, sesjonId, onVelgRep }) {
  const farge  = PARTI_FARGER[parti.id] || '#6b7280';
  const bg     = PARTI_BG[parti.id]    || '#f9fafb';
  const repIds = useMemo(() => new Set(parti.representanter.map(r => r.id)), [parti]);

  const { data: sakerData,  loading: sakerLoad  } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);
  const { data: skrData  } = useData(sesjonId ? () => API.skriftligeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: intData  } = useData(sesjonId ? () => API.interpellasjoner(sesjonId)    : null, [sesjonId]);
  const { data: spørData } = useData(sesjonId ? () => API.sporretimeSporsmal(sesjonId)  : null, [sesjonId]);

  const alleSaker = useMemo(() => parse.saker(sakerData), [sakerData]);
  const alleSporsmal = useMemo(() => [
    ...parse.sporsmalListe(skrData, 'skriftlige'),
    ...parse.sporsmalListe(intData, 'interpellasjoner'),
    ...parse.sporsmalListe(spørData, 'sporretimen'),
  ], [skrData, intData, spørData]);

  const partiSaker    = useMemo(() => alleSaker.filter(s =>
    toArray(s.forslagstiller_liste).some(f => repIds.has(f.id)) ||
    toArray(s.saksordfoerer_liste) .some(f => repIds.has(f.id))
  ), [alleSaker, repIds]);

  const partiSporsmal = useMemo(() => alleSporsmal.filter(sp => repIds.has(sp.fra?.id)), [alleSporsmal, repIds]);

  // Tematisk profil fra saker
  const temaer = useMemo(() => {
    const freq = {};
    partiSaker.forEach(s => toArray(s.emne_liste).forEach(e => {
      if (e.navn) freq[e.navn] = (freq[e.navn] || 0) + 1;
    }));
    return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 12);
  }, [partiSaker]);

  // Intern aktivitetsrangering (preview topp 3)
  const topReps = useMemo(() => {
    const reg = {};
    partiSaker.forEach(s => {
      toArray(s.forslagstiller_liste).filter(f => repIds.has(f.id)).forEach(f => {
        if (!reg[f.id]) reg[f.id] = { rep: parti.representanter.find(r => r.id === f.id) || f, forslag: 0, saksord: 0, spm: 0 };
        reg[f.id].forslag++;
      });
      toArray(s.saksordfoerer_liste).filter(f => repIds.has(f.id)).forEach(f => {
        if (!reg[f.id]) reg[f.id] = { rep: parti.representanter.find(r => r.id === f.id) || f, forslag: 0, saksord: 0, spm: 0 };
        reg[f.id].saksord++;
      });
    });
    partiSporsmal.forEach(sp => {
      if (!sp.fra?.id || !repIds.has(sp.fra.id)) return;
      if (!reg[sp.fra.id]) reg[sp.fra.id] = { rep: parti.representanter.find(r => r.id === sp.fra.id) || sp.fra, forslag: 0, saksord: 0, spm: 0 };
      reg[sp.fra.id].spm++;
    });
    return Object.values(reg)
      .map(r => ({ ...r, total: r.forslag + r.spm }))
      .sort((a, b) => b.total - a.total);
  }, [partiSaker, partiSporsmal, repIds, parti.representanter]);

  const reps   = parti.representanter.filter(r => !r.vara_representant);
  const varaer = parti.representanter.filter(r => r.vara_representant);
  return (
    <div className="p-4 space-y-5">
      {/* Parti-identitet */}
      <div className="rounded-xl overflow-hidden border" style={{ borderColor: `${farge}30` }}>
        <div style={{ background: farge, height: '4px' }} />
        <div className="p-4" style={{ background: bg }}>
          {/* Mandater */}
          <div className="flex items-center justify-around mb-3">
            <div className="text-center">
              <p className="text-2xl font-bold" style={{ color: farge }}>{reps.length}</p>
              <p className="text-[11px] text-gray-500">Representanter</p>
            </div>
            <div className="h-8 w-px bg-gray-200" />
            <div className="text-center">
              <p className="text-2xl font-bold" style={{ color: farge }}>{varaer.length}</p>
              <p className="text-[11px] text-gray-500">Varaer</p>
            </div>
            <div className="h-8 w-px bg-gray-200" />
            <div className="text-center">
              <p className="text-2xl font-bold" style={{ color: farge }}>{reps.length + varaer.length}</p>
              <p className="text-[11px] text-gray-500">Totalt</p>
            </div>
          </div>
          {/* Aktivitetsindikatorer */}
          <div className="grid grid-cols-3 gap-2 pt-3 border-t text-center" style={{ borderColor: `${farge}20` }}>
            {[
              { n: partiSaker.length,    lbl: 'Saker',         loading: sakerLoad },
              { n: partiSporsmal.length, lbl: 'Spørsmål stilt' },
              { n: topReps.length,       lbl: 'Aktive repr.'   },
            ].map(({ n, lbl, loading: l }) => (
              <div key={lbl}>
                {l ? <Spinner liten /> : <p className="text-lg font-bold" style={{ color: farge }}>{n}</p>}
                <p className="text-[10px] text-gray-400 mt-0.5 leading-tight">{lbl}</p>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Tematisk profil */}
      {temaer.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Tematisk profil</p>
          <TematiskProfilSirkel temaer={temaer} />
        </div>
      )}
      {sakerLoad && <div className="flex justify-center py-2"><Spinner liten /></div>}

      {/* Topp 3 repr. */}
      {topReps.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Mest aktive</p>
          <div className="space-y-1.5">
            {topReps.slice(0, 3).map((r, i) => {
              const navn = [r.rep.fornavn, r.rep.etternavn].filter(Boolean).join(' ');
              return (
                <button key={r.rep.id} onClick={() => onVelgRep && onVelgRep(r.rep)}
                  className="w-full flex items-center gap-2 p-2 bg-gray-50 hover:bg-blue-50 rounded-lg transition-colors">
                  <span className="text-[11px] text-gray-300 w-4 text-right shrink-0">{i+1}</span>
                  <RepFoto personId={r.rep.id} navn={navn} />
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-medium text-gray-800 truncate hover:text-blue-700">{navn}</p>
                    <div className="flex gap-2 mt-0.5">
                      {r.forslag > 0 && <span className="text-[10px] text-blue-400">{r.forslag} forslag</span>}
                      {r.saksord > 0 && <span className="text-[10px] text-purple-400">{r.saksord} saksord.</span>}
                      {r.spm     > 0 && <span className="text-[10px] text-emerald-500">{r.spm} spm.</span>}
                    </div>
                  </div>
                  <span className="text-xs font-bold shrink-0" style={{ color: farge }}>{r.total}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Intern rangering ─────────────────────────────────────────
function PartiRangeringFane({ parti, sesjonId, onVelgRep }) {
  const farge  = PARTI_FARGER[parti.id] || '#6b7280';
  const repIds = useMemo(() => new Set(parti.representanter.map(r => r.id)), [parti]);

  const { data: sakerData,  loading: sakerLoad  } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);
  const { data: skrData  } = useData(sesjonId ? () => API.skriftligeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: intData  } = useData(sesjonId ? () => API.interpellasjoner(sesjonId)    : null, [sesjonId]);
  const { data: spørData } = useData(sesjonId ? () => API.sporretimeSporsmal(sesjonId)  : null, [sesjonId]);

  const alleSaker    = useMemo(() => parse.saker(sakerData), [sakerData]);
  const alleSporsmal = useMemo(() => [
    ...parse.sporsmalListe(skrData, 'skriftlige'),
    ...parse.sporsmalListe(intData, 'interpellasjoner'),
    ...parse.sporsmalListe(spørData, 'sporretimen'),
  ], [skrData, intData, spørData]);

  const rangering = useMemo(() => {
    const reg = {};
    const init = (id) => {
      if (!reg[id]) {
        const rep = parti.representanter.find(r => r.id === id);
        reg[id] = { rep: rep || { id }, forslag: 0, saksord: 0, spm: 0 };
      }
    };
    alleSaker.forEach(s => {
      toArray(s.forslagstiller_liste).filter(f => repIds.has(f.id)).forEach(f => { init(f.id); reg[f.id].forslag++; });
      toArray(s.saksordfoerer_liste) .filter(f => repIds.has(f.id)).forEach(f => { init(f.id); reg[f.id].saksord++; });
    });
    alleSporsmal.forEach(sp => {
      if (sp.fra?.id && repIds.has(sp.fra.id)) { init(sp.fra.id); reg[sp.fra.id].spm++; }
    });
    // Legg til inaktive reps med 0-score
    parti.representanter.forEach(r => { if (!reg[r.id]) reg[r.id] = { rep: r, forslag: 0, saksord: 0, spm: 0 }; });
    return Object.values(reg)
      .map(r => ({ ...r, total: r.forslag + r.spm }))
      .sort((a, b) => b.total - a.total);
  }, [alleSaker, alleSporsmal, repIds, parti.representanter]);

  const maks = rangering[0]?.total || 1;

  if (sakerLoad) return <Spinner />;

  return (
    <div>
      <p className="text-[11px] text-gray-400 px-4 py-2 border-b border-gray-100">
        {rangering.length} representanter · rangert etter forslag + spørsmål
      </p>
      <div className="divide-y divide-gray-50">
        {rangering.map((r, i) => {
          const navn  = [r.rep.fornavn, r.rep.etternavn].filter(Boolean).join(' ');
          const fylke = r.rep.fylke?.navn || '';
          const barW  = maks > 0 ? Math.round(r.total / maks * 100) : 0;
          const erVara = r.rep.vara_representant;
          return (
            <button key={r.rep.id} onClick={() => onVelgRep && onVelgRep(r.rep)}
              className="w-full text-left px-4 py-2.5 hover:bg-gray-50 transition-colors">
              <div className="flex items-center gap-2">
                <span className="text-[11px] text-gray-300 w-5 text-right shrink-0">{i+1}</span>
                <RepFoto personId={r.rep.id} navn={navn} />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5">
                    <p className="text-xs font-medium text-gray-800 truncate">{navn}</p>
                    {erVara && <span className="text-[9px] bg-yellow-100 text-yellow-600 px-1 rounded shrink-0">vara</span>}
                  </div>
                  {fylke && <p className="text-[10px] text-gray-400">{fylke}</p>}
                </div>
                <div className="text-right shrink-0">
                  <p className="text-sm font-bold" style={{ color: r.total > 0 ? farge : '#d1d5db' }}>{r.total}</p>
                </div>
              </div>
              {r.total > 0 && (
                <>
                  <div className="ml-9 mt-1.5 h-1 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full" style={{ width: `${barW}%`, background: farge }} />
                  </div>
                  <div className="ml-9 flex gap-3 mt-0.5">
                    {r.forslag > 0 && <span className="text-[10px] text-blue-400">{r.forslag} forslag</span>}
                    {r.saksord > 0 && <span className="text-[10px] text-purple-400">{r.saksord} saksord.</span>}
                    {r.spm     > 0 && <span className="text-[10px] text-emerald-500">{r.spm} spørsmål</span>}
                  </div>
                </>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── Partiets saker ───────────────────────────────────────────
function PartiSakerFane({ parti, sesjonId }) {
  const repIds = useMemo(() => new Set(parti.representanter.map(r => r.id)), [parti]);
  const { data, loading, error } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);
  const [mode, setMode] = useState('forslag');

  const forslag = useMemo(() => parse.saker(data).filter(s =>
    toArray(s.forslagstiller_liste).some(f => repIds.has(f.id))
  ), [data, repIds]);
  const saksord = useMemo(() => parse.saker(data).filter(s =>
    toArray(s.saksordfoerer_liste).some(f => repIds.has(f.id))
  ), [data, repIds]);
  const visSaker = mode === 'forslag' ? forslag : saksord;

  if (loading) return <Spinner />;
  if (error)   return <FeilMelding feil={error} />;

  return (
    <div>
      <div className="flex border-b border-gray-100 bg-gray-50 shrink-0">
        {[
          { id: 'forslag', label: 'Forslag', n: forslag.length },
          { id: 'saksord', label: 'Saksordførerskap', n: saksord.length },
        ].map(t => (
          <button key={t.id} onClick={() => setMode(t.id)}
            className={`flex-1 py-2 text-xs font-medium transition-colors border-b-2 ${
              mode === t.id ? 'border-blue-500 text-blue-700 bg-white' : 'border-transparent text-gray-400 hover:text-gray-700'
            }`}>
            {t.label}
            <span className={`ml-1.5 px-1.5 py-px rounded-full text-[10px] font-bold ${
              mode === t.id ? 'bg-blue-100 text-blue-600' : 'bg-gray-200 text-gray-500'
            }`}>{t.n}</span>
          </button>
        ))}
      </div>
      {visSaker.length === 0
        ? <TomtResultat tekst="Ingen saker funnet." />
        : <div className="divide-y divide-gray-100">
            {visSaker.map(s => (
              <div key={s.id} className="px-4 py-3 hover:bg-gray-50 transition-colors">
                <p className="text-sm text-gray-800 leading-snug">{s.korttittel || s.tittel || `Sak #${s.id}`}</p>
                <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                  <StatusBadge status={s.status} />
                  {s.type && <span className="text-[11px] text-gray-400">{SAK_TYPE_MAP[s.type] || ''}</span>}
                  {s.komite?.navn && <span className="text-[11px] text-gray-400">· {s.komite.navn}</span>}
                </div>
                {toArray(s.emne_liste).length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-1.5">
                    {toArray(s.emne_liste).slice(0, 4).map(e => (
                      <span key={e.id} className="text-[10px] px-1.5 py-px rounded bg-gray-100 text-gray-500">{e.navn}</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
      }
    </div>
  );
}

// ── Partiets spørsmål ────────────────────────────────────────
function PartiSporsmalFane({ parti, sesjonId }) {
  const repIds = useMemo(() => new Set(parti.representanter.map(r => r.id)), [parti]);
  const { data: skrData,  loading: l1 } = useData(sesjonId ? () => API.skriftligeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: intData,  loading: l2 } = useData(sesjonId ? () => API.interpellasjoner(sesjonId)    : null, [sesjonId]);
  const { data: spørData, loading: l3 } = useData(sesjonId ? () => API.sporretimeSporsmal(sesjonId)  : null, [sesjonId]);

  const sporsmal = useMemo(() => [
    ...parse.sporsmalListe(skrData, 'skriftlige'),
    ...parse.sporsmalListe(intData, 'interpellasjoner'),
    ...parse.sporsmalListe(spørData, 'sporretimen'),
  ].filter(sp => repIds.has(sp.fra?.id))
   .sort((a, b) => {
     const aMs = Number(String(a.dato||0).match(/\d{10,}/)?.[0]||0);
     const bMs = Number(String(b.dato||0).match(/\d{10,}/)?.[0]||0);
     return bMs - aMs;
   }), [skrData, intData, spørData, repIds]);

  if ((l1 || l2 || l3) && !sporsmal.length) return <Spinner />;
  if (!sporsmal.length) return <TomtResultat tekst="Ingen spørsmål funnet for denne sesjonen." />;

  return (
    <div>
      <p className="text-[11px] text-gray-400 px-4 py-2 border-b border-gray-100">{sporsmal.length} spørsmål</p>
      <div className="divide-y divide-gray-100">
        {sporsmal.map((sp, i) => {
          const navn = sp.fra ? [sp.fra.fornavn, sp.fra.etternavn].filter(Boolean).join(' ') : '';
          const statusInfo = SPORSMAL_STATUS[String(sp.status??'').toLowerCase()] || { label: String(sp.status??'–'), farge: 'gray' };
          const typeLabel  = SPORSMAL_TYPER.find(t => t.id === sp.type)?.label || '';
          return (
            <div key={i} className="px-4 py-3 hover:bg-gray-50 transition-colors">
              <p className="text-sm text-gray-800 leading-snug line-clamp-2">{sp.tittel}</p>
              <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                {sp.fra && (
                  <span className="flex items-center gap-1">
                    <RepFoto personId={sp.fra.id} navn={navn} />
                    <span className="text-xs text-gray-600">{navn}</span>
                  </span>
                )}
                <Badge farge={statusInfo.farge} liten>{statusInfo.label}</Badge>
                {typeLabel && <Badge liten>{typeLabel}</Badge>}
                {sp.dato && <span className="text-[11px] text-gray-400">{formatDato(sp.dato)}</span>}
                {sp.til  && <span className="text-[11px] text-gray-400">→ {sp.til}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Partiets utvikling: sesjonsammenligning ───────────────────
function PartiUtviklingFane({ parti, sesjonId }) {
  const repIds = useMemo(() => new Set(parti.representanter.map(r => r.id)), [parti]);
  const farge  = PARTI_FARGER[parti.id] || '#6b7280';
  const prevId = forrigeSesjon(sesjonId);

  const { data: sakerNå,  loading: l1 } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);
  const { data: sakerFør, loading: l2 } = useData(prevId   ? () => API.saker(prevId)   : null, [prevId]);
  const { data: skrNå   } = useData(sesjonId ? () => API.skriftligeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: intNå   } = useData(sesjonId ? () => API.interpellasjoner(sesjonId)    : null, [sesjonId]);
  const { data: spørNå  } = useData(sesjonId ? () => API.sporretimeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: skrFør  } = useData(prevId   ? () => API.skriftligeSporsmal(prevId)   : null, [prevId]);
  const { data: intFør  } = useData(prevId   ? () => API.interpellasjoner(prevId)     : null, [prevId]);
  const { data: spørFør } = useData(prevId   ? () => API.sporretimeSporsmal(prevId)   : null, [prevId]);

  const stats = useMemo(() => {
    const calcStats = (sakerData, skr, int, spør) => {
      const saker    = parse.saker(sakerData);
      const sporsmal = [
        ...parse.sporsmalListe(skr,  'skriftlige'),
        ...parse.sporsmalListe(int,  'interpellasjoner'),
        ...parse.sporsmalListe(spør, 'sporretimen'),
      ].filter(s => repIds.has(s.fra?.id));
      const forslag = saker.filter(s => toArray(s.forslagstiller_liste).some(f => repIds.has(f.id)));
      const temaFreq = {};
      forslag.forEach(s => toArray(s.emne_liste).forEach(e => {
        if (e.navn) temaFreq[e.navn] = (temaFreq[e.navn] || 0) + 1;
      }));
      return { forslag: forslag.length, spm: sporsmal.length, temaFreq };
    };
    const nå  = calcStats(sakerNå,  skrNå,  intNå,  spørNå);
    const før = calcStats(sakerFør, skrFør, intFør, spørFør);
    const alleTema = new Set([...Object.keys(nå.temaFreq), ...Object.keys(før.temaFreq)]);
    const temaDelta = [...alleTema]
      .map(t => ({ tema: t, nå: nå.temaFreq[t] || 0, før: før.temaFreq[t] || 0 }))
      .sort((a, b) => (b.nå - b.før) - (a.nå - a.før))
      .slice(0, 12);
    return { nå, før, temaDelta };
  }, [sakerNå, sakerFør, skrNå, skrFør, intNå, intFør, spørNå, spørFør, repIds]);

  if (l1 || l2) return <Spinner />;
  if (!prevId) return <TomtResultat tekst="Ingen forrige sesjon å sammenligne med." />;

  const Delta = ({ nå, før }) => {
    const d = nå - før;
    if (d === 0) return <span className="text-gray-400 text-xs">→</span>;
    return d > 0
      ? <span className="text-emerald-600 text-xs font-bold">+{d} ↑</span>
      : <span className="text-red-500 text-xs font-bold">{d} ↓</span>;
  };

  const maks = Math.max(1, ...stats.temaDelta.map(t => Math.max(t.nå, t.før)));

  return (
    <div className="p-4 space-y-5">
      <p className="text-[11px] text-gray-400 font-medium">{prevId} → {sesjonId}</p>

      <div className="grid grid-cols-2 gap-3">
        {[
          { lbl: 'Forslag fremmet', nå: stats.nå.forslag, før: stats.før.forslag },
          { lbl: 'Spørsmål stilt',  nå: stats.nå.spm,     før: stats.før.spm     },
        ].map(({ lbl, nå, før }) => (
          <div key={lbl} className="bg-gray-50 rounded-xl p-3 text-center">
            <p className="text-[11px] text-gray-500 font-medium mb-2">{lbl}</p>
            <div className="flex items-center justify-center gap-3">
              <div>
                <p className="text-xl font-bold text-gray-300">{før}</p>
                <p className="text-[10px] text-gray-400">{prevId}</p>
              </div>
              <Delta nå={nå} før={før} />
              <div>
                <p className="text-xl font-bold" style={{ color: farge }}>{nå}</p>
                <p className="text-[10px] text-gray-400">{sesjonId}</p>
              </div>
            </div>
          </div>
        ))}
      </div>

      {stats.temaDelta.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Tematisk utvikling</p>
          <div className="space-y-2">
            {stats.temaDelta.map(({ tema, nå, før }) => {
              const erNy       = nå > 0 && før === 0;
              const erBortfalt = nå === 0 && før > 0;
              return (
                <div key={tema} className="flex items-center gap-2">
                  <span className={`text-[10px] w-2 shrink-0 font-bold ${erNy ? 'text-emerald-500' : erBortfalt ? 'text-red-400' : 'text-gray-200'}`}>
                    {erNy ? '●' : erBortfalt ? '○' : '·'}
                  </span>
                  <span className="text-xs text-gray-700 w-36 shrink-0 truncate" title={tema}>{tema}</span>
                  <div className="flex-1 flex items-center gap-1 min-w-0">
                    <div className="flex-1 h-1 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full bg-gray-300" style={{ width: `${Math.round(før/maks*100)}%` }} />
                    </div>
                    <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{ width: `${Math.round(nå/maks*100)}%`, background: farge }} />
                    </div>
                  </div>
                  <span className={`text-[10px] w-5 text-right shrink-0 font-medium ${erNy ? 'text-emerald-500' : erBortfalt ? 'text-red-400' : 'text-gray-400'}`}>{nå}</span>
                </div>
              );
            })}
          </div>
          <div className="flex gap-4 mt-2.5 text-[10px] text-gray-400 flex-wrap">
            <span className="text-emerald-500">● Nytt tema</span>
            <span className="text-red-400">○ Bortfalt</span>
            <span>Grå = {prevId} · Parti-farge = {sesjonId}</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Partiets stemmegiving: kryss-parti samsvar ────────────────
function PartiStemmegivingFane({ parti, sesjonId }) {
  const repIds = useMemo(() => new Set(parti.representanter.map(r => r.id)), [parti]);
  const farge  = PARTI_FARGER[parti.id] || '#6b7280';

  const { data: sesjonData } = useData(() => API.sesjoner(), []);
  const alleSesjoner = useMemo(() => parse.sesjoner(sesjonData).slice(0, 8), [sesjonData]);

  const [params, setParams] = useState({ sesjoner: [sesjonId], antallSaker: 25, sakstype: 'lovbudsjett' });
  const [temaFilter, setTemaFilter] = useState('alle');
  const [analyse,  setAnalyse]  = useState(null);
  const [kjører,   setKjører]   = useState(false);
  const [feil,     setFeil]     = useState(null);
  const [progress, setProgress] = useState({ tekst: '', pst: 0 });

  useEffect(() => { setAnalyse(null); setFeil(null); setTemaFilter('alle'); }, [parti.id]);
  useEffect(() => {
    setParams(p => ({ ...p, sesjoner: p.sesjoner.includes(sesjonId) ? p.sesjoner : [sesjonId] }));
  }, [sesjonId]);

  const toggleSesjon = (sId) => setParams(p => {
    const aktive = p.sesjoner.includes(sId) ? p.sesjoner.filter(s => s !== sId) : [...p.sesjoner, sId];
    return { ...p, sesjoner: aktive.length ? aktive : [sId] };
  });

  const kjørAnalyse = async () => {
    if (!params.sesjoner.length) return;
    setKjører(true); setFeil(null); setProgress({ tekst: 'Henter saker…', pst: 5 });
    try {
      // 1. Hent saker for alle valgte sesjoner
      const alleSakerRaw = [];
      for (const sId of params.sesjoner) {
        const sd = await API.saker(sId);
        parse.saker(sd).forEach(s => alleSakerRaw.push({ ...s, _sesjon: sId }));
      }

      // 2. Filtrer etter sakstype
      let filtrerte = alleSakerRaw;
      if (params.sakstype === 'lovbudsjett') {
        filtrerte = filtrerte.filter(s => s.type === 1 || s.type === 2);
      } else if (params.sakstype === 'representant') {
        filtrerte = filtrerte.filter(s => s.type === 5 || s.type === 6 ||
          String(s.type_tekstkode || '').toLowerCase().includes('repr'));
      }

      // 3. Ekstraher tilgjengelige temaer
      const temaFreq = {};
      filtrerte.forEach(s => toArray(s.emne_liste).forEach(e => {
        if (e.navn) temaFreq[e.navn] = (temaFreq[e.navn] || 0) + 1;
      }));
      const tilgjengeligeTemaer = Object.entries(temaFreq)
        .sort((a, b) => b[1] - a[1]).slice(0, 30).map(([navn, n]) => ({ navn, n }));

      // 4. Begrens antall saker
      const maxSaker = params.antallSaker >= 999 ? filtrerte.length : params.antallSaker;
      const utvalg = filtrerte.slice(0, maxSaker);
      setProgress({ tekst: `Henter voteringer for ${utvalg.length} saker…`, pst: 15 });

      // 5. Hent voteringer for hver sak
      const voteringsLister = await Promise.all(utvalg.map(s => API.voteringer(s.id).catch(() => null)));
      const alleVoteringer  = voteringsLister.flatMap((d, i) =>
        parse.voteringer(d).map(v => ({ ...v, _sak: utvalg[i] })));
      setProgress({ tekst: `Henter resultater for ${alleVoteringer.length} voteringer…`, pst: 25 });

      if (!alleVoteringer.length) {
        setAnalyse({ sakerMedData: [], tilgjengeligeTemaer, sesjoner: params.sesjoner });
        setTemaFilter('alle');
        return;
      }

      // 6. Hent voteringsresultat
      let done = 0;
      const stemmeListe = await Promise.all(alleVoteringer.map(v => {
        const vid = v.votering_id || v.id;
        return API.voteringsresultat(vid)
          .then(d => {
            done++;
            setProgress({ tekst: `Votering ${done}/${alleVoteringer.length}…`, pst: 25 + Math.floor(done / alleVoteringer.length * 70) });
            return { v, stemmer: parse.voteringsresultat(d) };
          })
          .catch(() => null);
      }));

      // 7. Grupper per sak
      const sakMap = new Map();
      stemmeListe.forEach(item => {
        if (!item) return;
        const sakId = item.v._sak?.id;
        if (!sakMap.has(sakId)) sakMap.set(sakId, { sak: item.v._sak, stemmeData: [] });
        sakMap.get(sakId).stemmeData.push(item.stemmer);
      });

      setAnalyse({ sakerMedData: [...sakMap.values()], tilgjengeligeTemaer, sesjoner: [...params.sesjoner] });
      setTemaFilter('alle');
    } catch (e) {
      setFeil(e.message);
    } finally {
      setKjører(false);
    }
  };

  // Beregn alignment klientsidert — oppdateres umiddelbart ved temaFilter-endring
  const { partiAlignment, analyserteVoteringer } = useMemo(() => {
    if (!analyse?.sakerMedData?.length) return { partiAlignment: [], analyserteVoteringer: 0 };
    const filtrert = temaFilter === 'alle' ? analyse.sakerMedData
      : analyse.sakerMedData.filter(({ sak }) =>
          toArray(sak?.emne_liste).some(e => e.navn === temaFilter));
    const alignment = {};
    let antVot = 0;
    filtrert.forEach(({ stemmeData }) => {
      stemmeData.forEach(stemmer => {
        if (!stemmer) return;
        const egne = stemmer.filter(s => repIds.has(s.representant?.id) && s.votering !== 1);
        if (egne.length < 2) return;
        const egneFor  = egne.filter(s => s.votering === 2).length;
        const egeneMot = egne.filter(s => s.votering === 3).length;
        if (egneFor + egeneMot === 0) return;
        const partiPos = egneFor >= egeneMot ? 2 : 3;
        antVot++;
        const andreReg = {};
        stemmer.filter(s => !repIds.has(s.representant?.id) && s.votering !== 1 && s.representant?.parti?.id)
          .forEach(s => {
            const pid = s.representant.parti.id;
            if (!andreReg[pid]) andreReg[pid] = { navn: s.representant.parti.navn || pid, for: 0, mot: 0 };
            if (s.votering === 2) andreReg[pid].for++; else andreReg[pid].mot++;
          });
        Object.entries(andreReg).forEach(([pid, p]) => {
          if (p.for + p.mot < 2) return;
          const andresPos = p.for >= p.mot ? 2 : 3;
          if (!alignment[pid]) alignment[pid] = { navn: p.navn, felles: 0, like: 0 };
          alignment[pid].felles++;
          if (andresPos === partiPos) alignment[pid].like++;
        });
      });
    });
    const partiAlignment = Object.entries(alignment)
      .filter(([, v]) => v.felles >= 3)
      .map(([id, v]) => ({ id, ...v, pst: Math.round(v.like / v.felles * 100) }))
      .sort((a, b) => b.pst - a.pst);
    return { partiAlignment, analyserteVoteringer: antVot };
  }, [analyse, temaFilter, repIds]);

  // ── Parameter-panel (alltid synlig) ──────────────────────────
  const paramPanel = (
    <div className="border-b border-gray-100 p-4 space-y-3 bg-gray-50 shrink-0">
      {/* Sesjoner */}
      <div>
        <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Sesjoner</p>
        <div className="flex flex-wrap gap-1.5">
          {alleSesjoner.length === 0
            ? <span className="text-[11px] text-gray-400">Laster…</span>
            : alleSesjoner.map(s => {
                const sId = s.id || s;
                const aktiv = params.sesjoner.includes(sId);
                return (
                  <button key={sId} onClick={() => toggleSesjon(sId)}
                    className={`px-2.5 py-0.5 rounded-full text-[11px] font-medium border transition-colors ${
                      aktiv ? 'text-white border-transparent' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-400'
                    }`}
                    style={aktiv ? { background: farge } : {}}>
                    {sId}
                  </button>
                );
              })
          }
        </div>
      </div>

      {/* Sakstype + Maks saker */}
      <div className="grid grid-cols-2 gap-2">
        <div>
          <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mb-1">Sakstype</p>
          <select value={params.sakstype}
            onChange={e => setParams(p => ({ ...p, sakstype: e.target.value }))}
            className="w-full text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-blue-400">
            <option value="alle">Alle typer</option>
            <option value="lovbudsjett">Lov + budsjett</option>
            <option value="representant">Representantforslag</option>
          </select>
        </div>
        <div>
          <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mb-1">Maks saker</p>
          <select value={params.antallSaker}
            onChange={e => setParams(p => ({ ...p, antallSaker: Number(e.target.value) }))}
            className="w-full text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-blue-400">
            <option value={10}>10 saker</option>
            <option value={25}>25 saker</option>
            <option value={50}>50 saker</option>
            <option value={100}>100 saker</option>
            <option value={999}>Alle saker</option>
          </select>
        </div>
      </div>

      <button onClick={kjørAnalyse} disabled={kjører || !params.sesjoner.length}
        className="w-full py-2 text-white text-xs font-semibold rounded-lg transition-colors disabled:opacity-50"
        style={{ background: farge }}>
        {analyse ? 'Oppdater analyse' : 'Kjør stemmeanalyse'}
      </button>
    </div>
  );

  if (kjører) return (
    <div className="flex flex-col h-full">
      {paramPanel}
      <div className="flex-1 flex flex-col items-center justify-center gap-4 p-6">
        <Spinner />
        <div className="w-full max-w-xs">
          <div className="flex justify-between text-xs text-gray-400 mb-1">
            <span>{progress.tekst}</span><span>{progress.pst}%</span>
          </div>
          <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div className="h-full bg-blue-500 rounded-full transition-all duration-300" style={{ width: `${progress.pst}%` }} />
          </div>
        </div>
      </div>
    </div>
  );

  if (!analyse) return (
    <div className="flex flex-col h-full">
      {paramPanel}
      {feil
        ? <div className="p-4"><FeilMelding feil={feil} /></div>
        : <div className="flex-1 flex flex-col items-center justify-center gap-3 p-6 text-center text-gray-400">
            <div className="w-10 h-10 rounded-full flex items-center justify-center text-xl"
              style={{ background: `${farge}18` }}>🗳</div>
            <p className="text-xs leading-relaxed">
              Velg sesjoner og parametere, deretter kjør analysen for å se hvilke partier
              som oftest stemmer likt som {parti.navn}.
            </p>
          </div>
      }
    </div>
  );

  return (
    <div className="flex flex-col h-full overflow-hidden">
      {paramPanel}
      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        {feil && <FeilMelding feil={feil} />}

        {/* Tema-filter */}
        {analyse.tilgjengeligeTemaer?.length > 0 && (
          <div>
            <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Tema</p>
            <div className="flex flex-wrap gap-1">
              <button onClick={() => setTemaFilter('alle')}
                className={`px-2 py-0.5 rounded-full text-[10px] font-medium border transition-colors ${
                  temaFilter === 'alle' ? 'text-white bg-gray-500 border-gray-500' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-400'
                }`}>
                Alle
              </button>
              {analyse.tilgjengeligeTemaer.map(t => (
                <button key={t.navn} onClick={() => setTemaFilter(temaFilter === t.navn ? 'alle' : t.navn)}
                  className={`px-2 py-0.5 rounded-full text-[10px] font-medium border transition-colors ${
                    temaFilter === t.navn ? 'text-white border-transparent' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-400'
                  }`}
                  style={temaFilter === t.navn ? { background: farge } : {}}>
                  {t.navn} <span className="opacity-60">({t.n})</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Metadata */}
        <p className="text-[11px] text-gray-400">
          {analyserteVoteringer} voteringer · {analyse.sesjoner.join(', ')}
          {temaFilter !== 'alle' && <span className="font-medium text-blue-500"> · {temaFilter}</span>}
        </p>

        {/* Resultater */}
        {partiAlignment.length === 0
          ? <TomtResultat tekst="Utilstrekkelig data (trenger ≥3 felles voteringer per parti). Prøv flere saker eller sesjoner." />
          : (
            <div className="space-y-2.5">
              <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide">
                Stemme-samsvar med {parti.navn}
              </p>
              {partiAlignment.map((p, i) => {
                const pF    = PARTI_FARGER[p.id] || '#6b7280';
                const score = p.pst >= 75 ? '#10b981' : p.pst >= 55 ? '#3b82f6' : p.pst >= 40 ? '#f59e0b' : '#ef4444';
                return (
                  <div key={p.id} className="flex items-center gap-3">
                    <span className="text-[11px] text-gray-300 w-4 text-right shrink-0">{i+1}</span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-semibold" style={{ color: pF }}>{p.navn || p.id}</span>
                        <span className="text-[10px] text-gray-400">{p.felles} vot.</span>
                      </div>
                      <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div className="h-full rounded-full transition-all" style={{ width: `${p.pst}%`, background: pF }} />
                      </div>
                    </div>
                    <span className="text-sm font-bold w-10 text-right shrink-0" style={{ color: score }}>
                      {p.pst}%
                    </span>
                  </div>
                );
              })}
            </div>
          )
        }
      </div>
    </div>
  );
}

// ── Hoved-view ───────────────────────────────────────────────
function PartierVisning({ sesjonId, onVelgRep }) {
  const [valgtParti, setValgtParti] = useState(null);
  const { data, loading, error } = useData(() => API.dagensRepresentanter(), []);
  const gruppert = useMemo(() => {
    const reps = parse.representanter(data);
    return parse.grupperPerParti(reps);
  }, [data]);

  // Velg første parti automatisk
  useEffect(() => {
    if (gruppert.length && !valgtParti) setValgtParti(gruppert[0]);
  }, [gruppert]);

  // Synkroniser valgtParti mot oppdatert gruppert (ved reload)
  useEffect(() => {
    if (valgtParti && gruppert.length) {
      const oppdatert = gruppert.find(p => p.id === valgtParti.id);
      if (oppdatert) setValgtParti(oppdatert);
    }
  }, [gruppert]);

  const handleVelgRep = (rep) => { onVelgRep && onVelgRep(rep); };

  if (loading) return <div className="flex-1 flex items-center justify-center"><Spinner /></div>;
  if (error)   return <FeilMelding feil={error} />;

  return (
    <div className="flex-1 overflow-hidden grid min-h-0" style={{ gridTemplateColumns: valgtParti ? '220px 1fr' : '1fr' }}>
      <PartiListeSidebar
        gruppert={gruppert}
        valgtId={valgtParti?.id}
        onVelg={setValgtParti}
      />
      {valgtParti && (
        <div className="h-full overflow-hidden">
          <PartiProfil
            parti={valgtParti}
            sesjonId={sesjonId}
            onVelgRep={handleVelgRep}
            onLukk={() => setValgtParti(null)}
          />
        </div>
      )}
    </div>
  );
}

// Konfig per spørsmålstype
const SPORSMAL_TYPER = [
  { id: 'alle',            label: 'Alle typer' },
  { id: 'skriftlige',      label: 'Skriftlige spørsmål',  apiFn: 'skriftligeSporsmal' },
  { id: 'interpellasjoner',label: 'Interpellasjoner',     apiFn: 'interpellasjoner'   },
  { id: 'sporretimen',     label: 'Spørretimen',          apiFn: 'sporretimeSporsmal' },
];

const SPORSMAL_STATUS = {
  'til_behandling': { label: 'Ubesvart',  farge: 'yellow' },
  'besvart':        { label: 'Besvart',   farge: 'green'  },
  'trukket':        { label: 'Trukket',   farge: 'gray'   },
  'bortfalt':       { label: 'Bortfalt',  farge: 'gray'   },

// Lenke til spørsmål på stortinget.no
const sporsmalUrl = (type, id) => {
  if (type === 'skriftlige')

};

// Enkelt spørsmål i listen

  const navn    = sp.fra ? [sp.fra.fornavn, sp.fra.etternavn].filter(Boolean).join(' ') : '–';

  const dato    = formatDato(sp.dato);

  return (

}

          <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Spørsmålstekst</h3>

// Hook: hent alle spørsmål for én type
function useSporsmal(type, sesjonId) {
  const cfg = SPORSMAL_TYPER.find(t => t.id === type);
  return useData(
    cfg?.apiFn ? () => API[cfg.apiFn](sesjonId).then(d => parse.sporsmalListe(d, type)) : null,
    [type, sesjonId]
  );
}

// Hoved-view for spørsmål
function SporsmalVisning({ sesjonId, jumpTil }) {
  const [typeFilter,  setTypeFilter]  = useState('skriftlige');
  const [partiFilter, setPartiFilter] = useState('alle');
  const [søk,         setSøk]         = useState('');
  const [valgt,       setValgt]       = useState(null);

  // Hopp direkte til et spørsmål (f.eks. fra tema-hub)
  useEffect(() => {
    if (jumpTil) {
      setValgt(jumpTil);
      if (jumpTil.type) setTypeFilter(jumpTil.type);
    }
  }, [jumpTil]);

  // Last aktiv type + interpellasjoner parallelt om "alle" er valgt
  const { data: skrData,   loading: skrLoad,   error: skrErr   } = useSporsmal('skriftlige',       sesjonId);
  const { data: interpData,loading: interpLoad, error: interpErr} = useSporsmal('interpellasjoner', sesjonId);
  const { data: spørrData, loading: spørrLoad,  error: spørrErr } = useSporsmal('sporretimen',      sesjonId);

  const allSporsmal = useMemo(() => {
    const skr    = skrData    || [];
    const interp = interpData || [];
    const spørr  = spørrData  || [];
    return [...skr, ...interp, ...spørr].sort((a, b) => {
      const aMs = Number(String(a.dato || 0).match(/\d{10,}/)?.[0] || 0);
      const bMs = Number(String(b.dato || 0).match(/\d{10,}/)?.[0] || 0);
      return bMs - aMs; // nyeste først
    });
  }, [skrData, interpData, spørrData]);

  const filtrerte = useMemo(() => {
    let res = typeFilter === 'alle'
      ? allSporsmal
      : allSporsmal.filter(s => s.type === typeFilter);

    if (partiFilter !== 'alle')
      res = res.filter(s => s.fra?.parti?.id === partiFilter);

    if (søk.trim()) {
      const q = søk.toLowerCase();
      res = res.filter(s =>
        (s.tittel || '').toLowerCase().includes(q) ||
        [s.fra?.fornavn, s.fra?.etternavn].join(' ').toLowerCase().includes(q)
      );
    }
    return res;
  }, [allSporsmal, typeFilter, partiFilter, søk]);

  // Unike partier i listen
  const partier = useMemo(() => {
    const unik = {};
    allSporsmal.forEach(s => {
      if (s.fra?.parti?.id) unik[s.fra.parti.id] = s.fra.parti.navn || s.fra.parti.id;
    });
    return Object.entries(unik).sort((a, b) => a[1].localeCompare(b[1], 'no'));
  }, [allSporsmal]);

  const loading = skrLoad || interpLoad || spørrLoad;
  const error   = skrErr || interpErr || spørrErr;

  return (
    <div className="flex-1 overflow-hidden grid min-h-0"
      style={{ gridTemplateColumns: valgt ? '360px 1fr' : '1fr' }}>

      {/* Venstre: filter + liste */}
      <div className="h-full flex flex-col border-r border-gray-200 bg-white">
        <div className="p-3 border-b border-gray-100 space-y-2 shrink-0">
          {/* Søk */}
          <div className="relative">
            <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm">🔍</span>
            <input type="text" placeholder="Søk i spørsmål…" value={søk}
              onChange={e => setSøk(e.target.value)}
              className="w-full pl-8 pr-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 bg-gray-50" />
            {søk && (
              <button onClick={() => setSøk('')}
                className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-xs">✕</button>
            )}
          </div>
          {/* Type-tabs */}
          <div className="flex gap-1 flex-wrap">
            {SPORSMAL_TYPER.map(t => (
              <button key={t.id} onClick={() => setTypeFilter(t.id)}
                className={`px-2.5 py-1 text-xs rounded-full font-medium transition-colors ${
                  typeFilter === t.id
                    ? 'bg-blue-600 text-white'
                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                }`}>
                {t.label}
              </button>
            ))}
          </div>
          {/* Partifilter */}
          <select value={partiFilter} onChange={e => setPartiFilter(e.target.value)}
            className="w-full text-sm border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-300">
            <option value="alle">Alle partier</option>
            {partier.map(([id, navn]) => <option key={id} value={id}>{navn}</option>)}
          </select>
          {!loading && (
            <p className="text-[11px] text-gray-400 px-1">
              {filtrerte.length} spørsmål
              {søk || partiFilter !== 'alle' ? ` · ${allSporsmal.filter(s => typeFilter === 'alle' || s.type === typeFilter).length} totalt` : ''}
            </p>
          )}
        </div>

        <div className="flex-1 overflow-y-auto">
          {loading && <Spinner />}
          {!loading && error && <FeilMelding feil={String(error)} />}
          {!loading && !error && filtrerte.length === 0 && (
            <TomtResultat tekst={søk ? 'Ingen spørsmål matcher søket' : 'Ingen spørsmål funnet for denne sesjonen'} />
          )}
          {filtrerte.map((sp, i) => (
            <SporsmalKort key={`${sp.type}-${sp.id || i}`} sp={sp}
              valgt={valgt?.id === sp.id && valgt?.type === sp.type}
              onClick={() => setValgt(sp)} />
          ))}
        </div>
      </div>

      {/* Høyre: detalj */}
      {valgt && (
        <div className="h-full overflow-hidden">
          <SporsmalDetalj sp={valgt} onLukk={() => setValgt(null)} />
        </div>
      )}
    </div>
  );
}

// SEKSJON 11b: TEMA-HUB
// Aggregerer all aktivitet rundt ett politisk tema på tvers av
// saker, spørsmål, representanter og partier.
// ═══════════════════════════════════════════════════════════════

const HURTIGTEMAER = [
  'innvandring','klima','pensjon','beredskap',
  'skatt','helse','utdanning','bolig','forsvar','kriminalitet',
];

// Synonymkart: søk på ett ord treffer alle relaterte termer
const TEMA_SYNONYMER = {
  'innvandring':  ['innvandring','integrering','asyl','flyktning','migrasjon','utlending','statsborger','innvandrer'],
  'klima':        ['klima','miljø','utslipp','co2','bærekraft','fornybar','grønn','klimagass','naturmangfold'],
  'pensjon':      ['pensjon','alderspensjon','trygd','uføre','pensjonsalder','afp','uføretrygd','aldersgrense'],
  'beredskap':    ['beredskap','krisehåndtering','sivilforsvaret','nødetat','katastrofe','sivil beredskap','redning'],
  'skatt':        ['skatt','avgift','skattelette','skatteparadis','formuesskatt','inntektsskatt','skatteinngang','avgiftsøkning'],
  'helse':        ['helse','sykehus','legemiddel','fastlege','psykisk','kreft','medisin','tannhelse','helseforetak'],
  'utdanning':    ['utdanning','skole','barnehage','universitet','lærer','studiefinansiering','opplæring','grunnskole','videregående'],
  'bolig':        ['bolig','husleie','boligpris','leietaker','tomtepris','startlån','boligbygging','eiendom'],
  'forsvar':      ['forsvar','militær','nato','forsvaret','sikkerhetspolitikk','hær','marine','luftforsvaret','verneplikt'],
  'kriminalitet': ['kriminalitet','politi','straff','fengsel','vold','narkotika','kriminalomsorgen','lovbrudd','organisert kriminalitet'],
};

// Utvid ett søkord til alle synonymer (returnerer array)
const utvidSøk = (q) => {
  const ql = q.toLowerCase();
  if (TEMA_SYNONYMER[ql]) return TEMA_SYNONYMER[ql];
  for (const synonymer of Object.values(TEMA_SYNONYMER)) {
    if (synonymer.includes(ql)) return synonymer;
  }
  return [ql];
};

function TemaHubResultat({ resultat, onRepKlikk, onSakKlikk, onSporsmalKlikk }) {

  const [visMerSporsmal, setVisMerSporsmal] = useState(false);
  const maksTotalt = topReps.length > 0 ? Math.max(...topReps.map(r => r.total)) : 1;

          </div>

          {/* Spørsmål */}
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div className="px-4 py-3 border-b border-gray-100 flex items-center gap-2">
              <span>❓</span>
              <h3 className="font-semibold text-sm text-gray-900">Spørsmål</h3>
              <span className="ml-auto text-xs text-gray-400">{sporsmal.length} treff</span>
            </div>
            {sporsmal.length === 0
              ? <p className="px-4 py-5 text-sm text-gray-400 text-center">Ingen spørsmål funnet.</p>
              : <>
                  <div className="divide-y divide-gray-50">
                    {(visMerSporsmal ? sporsmal : sporsmal.slice(0, 8)).map((sp, i) => {
                      const navn = sp.fra ? [sp.fra.fornavn, sp.fra.etternavn].filter(Boolean).join(' ') : '';
                      const partiId = sp.fra?.parti?.id;

                      const typeLabel  = SPORSMAL_TYPER.find(t => t.id === sp.type)?.label || '';
                      return (
                        <div key={i} className="group">

        {/* Sidebar: hvem engasjerer seg + partifordeling */}

              : <div className="divide-y divide-gray-50">

                    const navn   = [r.rep.fornavn, r.rep.etternavn].filter(Boolean).join(' ');

                    const pFarge  = PARTI_FARGER[partiId] || '#6b7280';

                      <button key={r.rep.id} onClick={() => onRepKlikk && onRepKlikk(r.rep)}
                        className="w-full text-left px-3 py-2.5 hover:bg-gray-50 transition-colors">

          )}

    </div>
  );
}

function TemaHubVisning({ sesjonId, onRepKlikk, onSakKlikk, onSporsmalKlikk }) {
  const [søkTekst, setSøkTekst] = useState('');
  const [aktivSøk, setAktivSøk] = useState('');
  const [laster,   setLaster]   = useState(false);
  const [resultat, setResultat] = useState(null);
  const [feil,     setFeil]     = useState(null);
  const inputRef = useRef(null);

  const kjørSøk = async (overstyr) => {
    const q = (overstyr !== undefined ? overstyr : søkTekst).trim().toLowerCase();
    if (!q || !sesjonId) return;
    if (overstyr !== undefined) setSøkTekst(overstyr);
    setAktivSøk(q);
    setLaster(true);
    setResultat(null);
    setFeil(null);

    try {
      const [sakerData, skrData, intData, spørData] = await Promise.all([
        API.saker(sesjonId),
        API.skriftligeSporsmal(sesjonId),
        API.interpellasjoner(sesjonId),
        API.sporretimeSporsmal(sesjonId),
      ]);

      const søkTermer = utvidSøk(q);

      const alleSaker = parse.saker(sakerData);
      const matchendeSaker = alleSaker.filter(s => {
        const tittel = `${s.tittel||''} ${s.korttittel||''}`.toLowerCase();
        const emner  = toArray(s.emne_liste).map(e => (e.navn||'').toLowerCase()).join(' ');
        return søkTermer.some(t => tittel.includes(t) || emner.includes(t));
      });

      const alleSporsmal = [
        ...parse.sporsmalListe(skrData,  'skriftlige'),
        ...parse.sporsmalListe(intData,  'interpellasjoner'),
        ...parse.sporsmalListe(spørData, 'sporretimen'),
      ];
      const matchendeSporsmal = alleSporsmal.filter(sp => {
        const tekst = `${sp.tittel||''} ${sp.tekst||''}`.toLowerCase();
        return søkTermer.some(t => tekst.includes(t));
      });

      const repReg = {};
      const regRep = (rep, felt) => {
        if (!rep?.id) return;
        if (!repReg[rep.id]) repReg[rep.id] = { rep, antSaker: 0, antSaksord: 0, antSporsmal: 0 };
        repReg[rep.id][felt]++;
      };
      matchendeSaker.forEach(s => {
        toArray(s.forslagstiller_liste).forEach(f => regRep(f, 'antSaker'));
        toArray(s.saksordfoerer_liste) .forEach(f => regRep(f, 'antSaksord'));
      });
      matchendeSporsmal.forEach(sp => { if (sp.fra) regRep(sp.fra, 'antSporsmal'); });

      const topReps = Object.values(repReg)
        .map(r => ({ ...r, total: r.antSaker + r.antSaksord + r.antSporsmal }))
        .sort((a, b) => b.total - a.total)
        .slice(0, 15);

      const partiReg = {};
      Object.values(repReg).forEach(({ rep, antSaker, antSaksord, antSporsmal }) => {
        const pid = rep.parti?.id || 'Ukjent';
        if (!partiReg[pid]) partiReg[pid] = { id: pid, navn: rep.parti?.navn || pid, saker: 0, sporsmal: 0 };
        partiReg[pid].saker    += antSaker + antSaksord;
        partiReg[pid].sporsmal += antSporsmal;
      });
      const partier = Object.values(partiReg)
        .map(p => ({ ...p, total: p.saker + p.sporsmal }))
        .sort((a, b) => b.total - a.total);

      setResultat({ søkTekst: q, søkTermer, saker: matchendeSaker, sporsmal: matchendeSporsmal, topReps, partier });
    } catch (e) {
      setFeil(e.message);
    } finally {
      setLaster(false);
    }
  };

  return (
    <div className="flex-1 flex flex-col min-h-0 overflow-hidden">
      {/* Søkebar */}
      <div className="shrink-0 bg-white border-b border-gray-200 px-6 py-4">
        <div className="max-w-2xl mx-auto">
          <div className="flex gap-2">
            <div className="relative flex-1">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-sm pointer-events-none">🔍</span>
              <input ref={inputRef} type="text"
                placeholder="Søk etter tema — f.eks. innvandring, klima, pensjon…"
                value={søkTekst}
                onChange={e => setSøkTekst(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && kjørSøk()}
                className="w-full pl-9 pr-9 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-gray-50" />
              {søkTekst && (
                <button onClick={() => { setSøkTekst(''); setResultat(null); setFeil(null); setAktivSøk(''); }}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-xs">✕</button>
              )}
            </div>
            <button onClick={() => kjørSøk()} disabled={!søkTekst.trim() || laster}
              className="px-5 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 disabled:opacity-40 transition-colors whitespace-nowrap">
              {laster ? '…' : 'Søk'}
            </button>
          </div>
          <div className="flex gap-1.5 mt-2.5 flex-wrap">
            {HURTIGTEMAER.map(t => (
              <button key={t} onClick={() => kjørSøk(t)}
                className={`text-[11px] px-2.5 py-1 rounded-full transition-colors ${
                  aktivSøk === t
                    ? 'bg-blue-100 text-blue-700 font-semibold'
                    : 'bg-gray-100 hover:bg-blue-50 hover:text-blue-700 text-gray-500'
                }`}>
                {t}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Innholdsområde */}
      <div className="flex-1 overflow-y-auto min-h-0">
        {laster && (
          <div className="flex flex-col items-center justify-center h-40 gap-3">
            <Spinner />
            <p className="text-sm text-gray-400">Søker på tvers av saker og spørsmål…</p>
          </div>
        )}
        {feil && !laster && <div className="p-6"><FeilMelding feil={feil} /></div>}
        {!laster && !resultat && !feil && (
          <div className="flex flex-col items-center justify-center h-full pb-20 text-center px-6">
            <div className="text-6xl mb-4">🗺️</div>
            <p className="text-lg font-semibold text-gray-700">Tema-hub</p>
            <p className="text-sm text-gray-400 mt-2 max-w-sm leading-relaxed">
              Søk på et politisk tema og få et komplett bilde av hvem som engasjerer seg,
              hvilke saker som er fremmet og hvilke spørsmål som stilles.
            </p>
            <div className="mt-6 flex gap-2 flex-wrap justify-center">
              {HURTIGTEMAER.slice(0, 5).map(t => (
                <button key={t} onClick={() => kjørSøk(t)}
                  className="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 text-sm rounded-lg transition-colors">
                  {t} →
                </button>
              ))}
            </div>
          </div>
        )}
        {!laster && resultat && <TemaHubResultat resultat={resultat} onRepKlikk={onRepKlikk} onSakKlikk={onSakKlikk} onSporsmalKlikk={onSporsmalKlikk} />}
      </div>
    </div>
  );
}

// ── InnleggKort — ett enkelt taleinnlegg ──────────────────────
function InnleggKort({ innlegg, rep, onVelgRep, søkL }) {
  const [ekspandert, setEkspandert] = useState(false);
  const farge = PARTI_FARGER[innlegg.parti] || '#6b7280';
  const erHoved = innlegg.type === 'hovedinnlegg' || innlegg.type === 'innlegg';
  const GRENSE = 400;
  const kortTekst = innlegg.tekst.length > GRENSE && !ekspandert
    ? innlegg.tekst.slice(0, GRENSE) + '…'
    : innlegg.tekst;

  const hilite = (tekst) => {
    if (!søkL || !tekst) return tekst;
    const esc = søkL.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const parts = tekst.split(new RegExp(`(${esc})`, 'gi'));
    return parts.map((p, i) =>
      p.toLowerCase() === søkL ? <mark key={i} className="bg-yellow-100 rounded px-0.5">{p}</mark> : p
    );
  };

  return (
    <div className={`flex gap-3 p-3 rounded-lg ${erHoved ? 'bg-white border border-gray-100 shadow-sm' : 'bg-gray-50'}`}>
      {rep
        ? <RepFoto personId={rep.id} navn={innlegg.navn} />
        : <div className="w-9 h-9 rounded-full bg-gray-200 flex items-center justify-center text-sm font-semibold text-gray-500 shrink-0">
            {innlegg.navn.split(' ').map(n => n[0]).filter(Boolean).slice(0,2).join('')}
          </div>
      }
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap mb-1.5">
          <button
            onClick={() => rep && onVelgRep && onVelgRep(rep)}
            className={`text-xs font-semibold leading-tight ${rep ? 'hover:underline' : 'cursor-default'}`}
            style={{ color: farge }}>
            {innlegg.navn}
          </button>
          {innlegg.parti && (
            <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium text-white shrink-0"
              style={{ background: farge }}>
              {innlegg.parti}
            </span>
          )}
          {!erHoved && (
            <span className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full shrink-0">
              {innlegg.type === 'replikk' ? 'Replikk' : innlegg.type}
            </span>
          )}
        </div>
        <p className="text-xs text-gray-700 leading-relaxed whitespace-pre-wrap">
          {hilite(kortTekst)}
        </p>
        {innlegg.tekst.length > GRENSE && (
          <button onClick={() => setEkspandert(e => !e)}
            className="text-[11px] text-blue-500 hover:text-blue-700 mt-1.5">
            {ekspandert ? 'Vis mindre ↑' : 'Les mer ↓'}
          </button>
        )}
      </div>
    </div>
  );
}

// ── SakInnleggListe — alle saker med innlegg i ett referat ────
function SakInnleggListe({ saker, repsMap, onVelgRep, søk }) {
  const [åpneSaker, setÅpneSaker] = useState(new Set());
  const søkL = søk.toLowerCase().trim();
  const prevLen = React.useRef(0);

  useEffect(() => {
    if (saker.length && saker.length !== prevLen.current) {
      setÅpneSaker(new Set(saker.map(s => s.sakId + s.sakTittel)));
      prevLen.current = saker.length;
    }
  }, [saker.length]);

  if (!saker.length) {
    return <div className="p-8 text-center text-sm text-gray-400">Ingen treff med valgte filtre</div>;
  }

  const toggle = (key) => setÅpneSaker(prev => {
    const ny = new Set(prev);
    ny.has(key) ? ny.delete(key) : ny.add(key);
    return ny;
  });

  return (
    <div className="divide-y divide-gray-100">
      {saker.map(sak => {
        const key  = sak.sakId + sak.sakTittel;
        const åpen = åpneSaker.has(key);
        return (
          <div key={key}>
            <button onClick={() => toggle(key)}
              className="w-full text-left px-4 py-3 flex items-center justify-between gap-3 hover:bg-gray-50 transition-colors">
              <div className="flex-1 min-w-0">
                <p className="text-sm font-semibold text-gray-800 leading-snug">{sak.sakTittel || 'Ukjent sak'}</p>
                <p className="text-[11px] text-gray-400 mt-0.5">{sak.innlegg.length} innlegg</p>
              </div>
              <span className="text-gray-300 text-xs shrink-0">{åpen ? '▲' : '▼'}</span>
            </button>
            {åpen && (
              <div className="px-4 pb-4 space-y-2">
                {sak.innlegg.map((inn, i) => {
                  const rep = repsMap.get(inn.navn.toLowerCase().trim());
                  return <InnleggKort key={i} innlegg={inn} rep={rep} onVelgRep={onVelgRep} søkL={søkL} />;
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── TalerRepAktivitetDetalj — én reps taleaktivitet (metadata) ─
function TalerRepAktivitetDetalj({ rep, indeks, onVelgRep }) {
  const navn  = [rep.fornavn, rep.etternavn].filter(Boolean).join(' ');
  const farge = PARTI_FARGER[rep.parti?.id] || '#6b7280';
  const akt   = [...(indeks.taleIndeks.get(rep.id) || [])].sort((a, b) =>
    (b.antall_innlegg || 0) - (a.antall_innlegg || 0));
  const tot = indeks.repTotaler.get(rep.id) || { ti: 0, ts: 0 };
  const fmtTid = (s) => { const m = Math.floor(s/60); const r = s%60; return m > 0 ? `${m}m ${r}s` : `${s}s`; };

  return (
    <div className="p-4 space-y-4">
      <div className="flex items-center gap-3">
        <RepFoto personId={rep.id} navn={navn} stor />
        <div className="flex-1 min-w-0">
          <h2 className="text-base font-semibold text-gray-900 leading-tight">{navn}</h2>
          <p className="text-sm font-semibold mt-0.5" style={{ color: farge }}>
            {rep.parti?.navn || rep.parti?.id}
          </p>
          <div className="flex gap-3 mt-1.5">
            <span className="text-xs text-gray-500">{tot.ti} innlegg totalt</span>
            <span className="text-xs text-gray-500">{fmtTid(tot.ts)} taletid</span>
          </div>
        </div>
        <button onClick={() => onVelgRep && onVelgRep(rep)}
          className="text-xs text-blue-500 hover:text-blue-700 shrink-0">
          Profil ↗
        </button>
      </div>

      <div>
        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">
          Saker ({akt.length})
        </p>
        <div className="space-y-1.5">
          {akt.map((a, i) => {
            const sek = a.taletid_i_sekunder || a.taletid_sekunder || 0;
            const m   = Math.floor(sek/60), r = sek%60;
            return (
              <div key={i} className="flex items-start gap-3 bg-gray-50 rounded-lg px-3 py-2.5">
                <div className="flex-1 min-w-0">
                  <p className="text-xs text-gray-800 leading-snug">
                    {a.sak_tittel || a.sak_kortittel || `Sak #${a.sak_id}`}
                  </p>
                </div>
                <div className="text-right shrink-0">
                  <p className="text-xs font-semibold text-gray-700 tabular-nums">
                    {m > 0 ? `${m}:${String(r).padStart(2,'0')}` : `${sek}s`}
                  </p>
                  {a.antall_innlegg > 0 && (
                    <p className="text-[10px] text-gray-400">{a.antall_innlegg} innlegg</p>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── TalerSakAktivitetDetalj — hvem snakket om én sak (metadata) ─
function TalerSakAktivitetDetalj({ sakId, indeks, onVelgRep }) {
  const sakInfo = indeks.sakTitler.get(sakId) || {};
  const talere  = [...(indeks.sakIndeks.get(sakId) || [])].sort((a, b) => b.innlegg - a.innlegg);
  const totalInnlegg = talere.reduce((s, t) => s + t.innlegg, 0);
  const fmtTid = (s) => { const m = Math.floor(s/60); const r = s%60; return m > 0 ? `${m}m ${r}s` : `${s}s`; };

  const partiTotaler = {};
  talere.forEach(t => {
    const pid = t.rep.parti?.id || 'Ukjent';
    partiTotaler[pid] = (partiTotaler[pid] || 0) + t.innlegg;
  });

  return (
    <div className="p-4 space-y-4">
      <div>
        <h2 className="text-base font-semibold text-gray-900 leading-snug">
          {sakInfo.tittel || sakInfo.korttittel || `Sak ${sakId}`}
        </h2>
        {sakInfo.emner?.length > 0 && (
          <div className="flex flex-wrap gap-1 mt-1.5">
            {sakInfo.emner.map(e => (
              <span key={e} className="text-[10px] bg-gray-100 text-gray-500 rounded-full px-2 py-0.5">{e}</span>
            ))}
          </div>
        )}
        <p className="text-xs text-gray-400 mt-1.5">
          {talere.length} unike talere · {totalInnlegg} innlegg totalt
        </p>
      </div>

      {Object.keys(partiTotaler).length > 1 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Parti-fordeling</p>
          <div className="flex h-3 rounded-full overflow-hidden gap-px">
            {Object.entries(partiTotaler).sort((a,b) => b[1]-a[1]).map(([pid, n]) => (
              <div key={pid} title={`${pid}: ${n} innlegg`}
                style={{ width: `${Math.round(n/totalInnlegg*100)}%`, background: PARTI_FARGER[pid] || '#9ca3af' }} />
            ))}
          </div>
          <div className="flex flex-wrap gap-2 mt-1.5">
            {Object.entries(partiTotaler).sort((a,b) => b[1]-a[1]).map(([pid, n]) => (
              <div key={pid} className="flex items-center gap-1">
                <span className="w-2 h-2 rounded-full shrink-0" style={{ background: PARTI_FARGER[pid] || '#9ca3af' }} />
                <span className="text-[10px] text-gray-500">{pid} {n}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Talere</p>
        <div className="space-y-1.5">
          {talere.map((t, i) => {
            const navn  = [t.rep.fornavn, t.rep.etternavn].filter(Boolean).join(' ');
            const farge = PARTI_FARGER[t.rep.parti?.id] || '#6b7280';
            return (
              <button key={t.rep.id || i} onClick={() => onVelgRep && onVelgRep(t.rep)}
                className="w-full flex items-center gap-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg px-3 py-2 transition-colors">
                <span className="text-[11px] text-gray-300 w-4 text-right shrink-0">{i+1}</span>
                <RepFoto personId={t.rep.id} navn={navn} />
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-medium text-gray-800 truncate">{navn}</p>
                  <p className="text-[10px] font-semibold" style={{ color: farge }}>{t.rep.parti?.id}</p>
                </div>
                <div className="text-right shrink-0">
                  <p className="text-xs font-bold text-gray-600">{t.innlegg} innlegg</p>
                  <p className="text-[10px] text-gray-400">{fmtTid(t.sek)}</p>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── TalerVisning — hoved-view ─────────────────────────────────
function TalerVisning({ sesjonId, onVelgRep }) {
  const [modus, setModus]       = useState('referat');
  const [valgtPubId, setValgtPubId]   = useState(null);
  const [lastetSaker, setLastetSaker] = useState(null);
  const [lastes, setLastes]           = useState(false);
  const [lastFeil, setLastFeil]       = useState(null);
  const [indeks, setIndeks]           = useState(null);
  const [bygger, setBygger]           = useState(false);
  const [progress, setProgress]       = useState({ gjort: 0, total: 0 });
  const [valgtRep, setValgtRep]       = useState(null);
  const [valgtSakId, setValgtSakId]   = useState(null);
  const [aktivModus, setAktivModus]   = useState('rep');
  const [søk, setSøk]                 = useState('');
  const [partiFilter, setPartiFilter] = useState('alle');

  const { data: referatXml, loading: referatListeLastes, error: referatListeFeil } =
    useData(sesjonId ? () => API.referatListe(sesjonId) : null, [sesjonId]);
  const { data: repsData }  = useData(() => API.dagensRepresentanter(), []);
  const { data: sakerData } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);

  const reps = useMemo(() => parse.representanter(repsData), [repsData]);

  const repsMap = useMemo(() => {
    const m = new Map();
    reps.forEach(r => m.set(`${r.fornavn} ${r.etternavn}`.toLowerCase().trim(), r));
    return m;
  }, [reps]);

  const referatListe = useMemo(() =>
    referatXml ? parse.referatListe(referatXml) : [], [referatXml]);

  const lastReferat = async (pubId) => {
    if (valgtPubId === pubId && lastetSaker) return;
    setValgtPubId(pubId);
    setLastes(true);
    setLastFeil(null);
    setLastetSaker(null);
    setSøk('');
    setPartiFilter('alle');
    try {
      const xml = await API.referat(pubId);
      setLastetSaker(parse.referatInnlegg(xml));
    } catch (e) {
      setLastFeil(e.message || 'Kunne ikke laste referat');
    } finally {
      setLastes(false);
    }
  };

  const partiIReferat = useMemo(() => {
    if (!lastetSaker) return [];
    const s = new Set();
    lastetSaker.forEach(sak => sak.innlegg.forEach(inn => { if (inn.parti) s.add(inn.parti); }));
    return [...s].sort();
  }, [lastetSaker]);

  const søkL = søk.toLowerCase().trim();

  const filtrerteSaker = useMemo(() => {
    if (!lastetSaker) return [];
    return lastetSaker
      .map(sak => ({
        ...sak,
        innlegg: sak.innlegg.filter(inn => {
          if (partiFilter !== 'alle' && inn.parti !== partiFilter) return false;
          if (!søkL) return true;
          return inn.navn.toLowerCase().includes(søkL) ||
                 inn.parti.toLowerCase().includes(søkL) ||
                 inn.tekst.toLowerCase().includes(søkL);
        }),
      }))
      .filter(sak => sak.innlegg.length > 0);
  }, [lastetSaker, søkL, partiFilter]);

  const byggIndeks = async () => {
    if (bygger || !sesjonId || reps.length === 0) return;
    setBygger(true);
    setProgress({ gjort: 0, total: reps.length });
    const saker = parse.saker(sakerData);
    const sakTitler = new Map();
    saker.forEach(s => sakTitler.set(String(s.id), {
      tittel: s.tittel, korttittel: s.korttittel,
      emner: toArray(s.emne_liste).map(e => e.navn).filter(Boolean),
    }));
    const taleIndeks = new Map(), sakIndeks = new Map(), repTotaler = new Map();
    let gjort = 0;
    await Promise.all(reps.map(async (rep) => {
      try {
        const d   = await API.taleaktivitet(rep.id, sesjonId);
        const akt = parse.taleaktivitet(d);
        const ti  = akt.reduce((s, a) => s + (a.antall_innlegg || 0), 0);
        const ts  = akt.reduce((s, a) => s + (a.taletid_i_sekunder || a.taletid_sekunder || 0), 0);
        taleIndeks.set(rep.id, akt);
        repTotaler.set(rep.id, { ti, ts });
        akt.forEach(a => {
          const sid = String(a.sak_id);
          if (!sakIndeks.has(sid)) sakIndeks.set(sid, []);
          sakIndeks.get(sid).push({ rep, innlegg: a.antall_innlegg || 0,
            sek: a.taletid_i_sekunder || a.taletid_sekunder || 0 });
        });
      } catch (_) {}
      gjort++;
      setProgress({ gjort, total: reps.length });
    }));
    setIndeks({ taleIndeks, sakIndeks, repTotaler, sakTitler });
    setBygger(false);
  };

  const partierListe = useMemo(() =>
    [...new Set(reps.map(r => r.parti?.id).filter(Boolean))].sort(), [reps]);

  const filtrertReps = useMemo(() => reps
    .filter(r => {
      const navn = `${r.fornavn} ${r.etternavn}`.toLowerCase();
      if (partiFilter !== 'alle' && r.parti?.id !== partiFilter) return false;
      if (søkL && !navn.includes(søkL)) return false;
      if (indeks && !(indeks.repTotaler.get(r.id)?.ti > 0)) return false;
      return true;
    })
    .sort((a, b) => {
      const ta = indeks?.repTotaler.get(a.id)?.ti || 0;
      const tb = indeks?.repTotaler.get(b.id)?.ti || 0;
      return tb - ta || (a.etternavn || '').localeCompare(b.etternavn || '', 'nb');
    }), [reps, søkL, partiFilter, indeks]);

  const filtrertAktivitetSaker = useMemo(() => {
    if (!indeks) return [];
    return [...indeks.sakIndeks.entries()]
      .map(([sakId, talere]) => ({
        sakId, info: indeks.sakTitler.get(sakId) || {}, talere,
        unikeTalere: talere.length,
        totalInnlegg: talere.reduce((s, t) => s + t.innlegg, 0),
      }))
      .filter(s => {
        if (!søkL) return true;
        const tittel = `${s.info.tittel||''} ${s.info.korttittel||''}`.toLowerCase();
        return tittel.includes(søkL) || (s.info.emner||[]).join(' ').toLowerCase().includes(søkL);
      })
      .sort((a, b) => b.unikeTalere - a.unikeTalere)
      .slice(0, 100);
  }, [indeks, søkL]);

  const switchModus = (m) => { setModus(m); setSøk(''); setPartiFilter('alle'); };

  return (
    <div className="flex-1 overflow-hidden flex flex-col min-h-0">
      {/* Modus-velger */}
      <div className="flex border-b border-gray-200 shrink-0 bg-white px-4">
        {[{ id:'referat', label:'Møtereferater' }, { id:'aktivitet', label:'Taleaktivitet' }].map(m => (
          <button key={m.id} onClick={() => switchModus(m.id)}
            className={`px-4 py-2.5 text-sm font-medium transition-colors ${
              modus === m.id ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-800'
            }`}>
            {m.label}
          </button>
        ))}
      </div>

      <div className="flex-1 flex overflow-hidden min-h-0">
        {/* VENSTRE PANEL */}
        <div className="w-64 shrink-0 border-r border-gray-200 flex flex-col overflow-hidden bg-white">
          <div className="p-3 border-b border-gray-100 space-y-2 shrink-0">
            <div className="relative">
              <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm pointer-events-none">🔍</span>
              <input value={søk} onChange={e => setSøk(e.target.value)}
                placeholder={modus === 'referat' ? 'Søk i referat…' : 'Søk representant…'}
                className="w-full pl-8 pr-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            {(modus === 'referat' ? partiIReferat : partierListe).length > 0 && (
              <select value={partiFilter} onChange={e => setPartiFilter(e.target.value)}
                className="w-full text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-blue-400">
                <option value="alle">Alle partier</option>
                {(modus === 'referat' ? partiIReferat : partierListe).map(p => (
                  <option key={p} value={p}>{p}</option>
                ))}
              </select>
            )}
          </div>

          <div className="flex-1 overflow-y-auto">
            {modus === 'referat' ? (
              referatListeLastes ? <div className="flex justify-center py-8"><Spinner /></div>
              : referatListeFeil ? <p className="p-4 text-xs text-red-400">Kunne ikke laste møteliste</p>
              : referatListe.length === 0 ? <p className="p-4 text-xs text-gray-400">Ingen referater funnet for sesjonen</p>
              : referatListe.map(pub => {
                  const dato  = (pub.dato || '').split('T')[0];
                  const datoF = dato ? new Date(dato).toLocaleDateString('nb-NO', { day:'numeric', month:'short', year:'2-digit' }) : '';
                  const valgt = valgtPubId === pub.id;
                  return (
                    <button key={pub.id} onClick={() => lastReferat(pub.id)}
                      className={`w-full text-left px-3 py-2.5 border-b border-gray-100 flex items-start gap-2.5 transition-colors ${
                        valgt ? 'bg-blue-50 border-l-[3px] border-l-blue-500' : 'hover:bg-gray-50 border-l-[3px] border-l-transparent'
                      }`}>
                      <p className="text-xs font-semibold text-gray-600 shrink-0 w-16 leading-tight">{datoF}</p>
                      <p className="text-xs text-gray-500 line-clamp-2 leading-tight flex-1">{pub.tittel}</p>
                    </button>
                  );
                })
            ) : (
              <div className="flex flex-col h-full">
                {indeks && (
                  <div className="flex border-b border-gray-100 shrink-0">
                    {[{ id:'rep', label:'Representanter' }, { id:'sak', label:'Saker' }].map(m => (
                      <button key={m.id} onClick={() => setAktivModus(m.id)}
                        className={`flex-1 py-2 text-xs font-medium transition-colors ${

                          <p className="text-[10px] font-semibold" style={{ color: farge }}>{r.parti?.id}</p>

                        <span className="text-xs font-bold text-gray-500 shrink-0">{tot.ti}</span>
                      </button>

                    const tittel = s.info.tittel || s.info.korttittel || `Sak ${s.sakId}`;
                    const valgt  = valgtSakId === s.sakId;
                    return (
                      <button key={s.sakId} onClick={() => { setValgtSakId(s.sakId); setValgtRep(null); }}
