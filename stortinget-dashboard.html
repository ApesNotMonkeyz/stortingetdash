<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ═══════════════════════════════════════════════════════════════
// SEKSJON 1: API
// Legg til nye endepunkter her ved utvidelse
// ═══════════════════════════════════════════════════════════════
const BASE = 'https://data.stortinget.no/eksport';

const _cache = new Map();

// ── Rate-limiter: maks 4 samtidige kall, 200 ms mellomrom, retry på 429 ──
const _sem = { active: 0, max: 4, kø: [] };
const _semAcquire = () => new Promise(resolve => {
  if (_sem.active < _sem.max) { _sem.active++; resolve(); }
  else _sem.kø.push(resolve);
});
const _semRelease = () => {
  if (_sem.kø.length) {
    const neste = _sem.kø.shift();
    setTimeout(() => neste(), 200); // 200 ms mellomrom mellom utkøede kall
  } else {
    _sem.active--;
  }
};

const fetchJson = async (url) => {
  if (_cache.has(url)) return _cache.get(url);
  await _semAcquire();
  try {
    for (let forsøk = 0; forsøk < 4; forsøk++) {
      const res = await fetch(url);
      if (res.status === 429) {
        // Vent og prøv igjen
        await new Promise(r => setTimeout(r, 2500 + forsøk * 1000));
        continue;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      _cache.set(url, data);
      return data;
    }
    throw new Error('For mange forsøk (429) – prøv igjen om litt');
  } finally {
    _semRelease();
  }
};

const fetchText = async (url) => {
  if (_cache.has(url)) return _cache.get(url);
  await _semAcquire();
  try {
    for (let forsøk = 0; forsøk < 4; forsøk++) {
      const res = await fetch(url);
      if (res.status === 429) {
        await new Promise(r => setTimeout(r, 2500 + forsøk * 1000));
        continue;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      _cache.set(url, text);
      return text;
    }
    throw new Error('For mange forsøk (429) – prøv igjen om litt');
  } finally {
    _semRelease();
  }
};

const API = {
  // ── Fase 1: Saker & voteringer ──────────────────────────────
  sesjoner:          ()             => fetchJson(`${BASE}/sesjoner?format=json`),
  saker:             (sesjonId)     => fetchJson(`${BASE}/saker?sesjonid=${sesjonId}&format=json`),
  sak:               (sakId)        => fetchJson(`${BASE}/sak?sakid=${sakId}&format=json`),
  voteringer:        (sakId)        => fetchJson(`${BASE}/voteringer?sakid=${sakId}&format=json`),
  voteringsresultat: (voteringId)   => fetchJson(`${BASE}/voteringsresultat?voteringid=${voteringId}&format=json`),
  voteringsforslag:  (voteringId)   => fetchJson(`${BASE}/voteringsforslag?voteringid=${voteringId}&format=json`),

  // ── Fase 2: Representanter & partier ────────────────────────
  dagensRepresentanter: ()          => fetchJson(`${BASE}/dagensrepresentanter?format=json`),
  taleaktivitet: (personId, sesjonId) =>
    fetchJson(`${BASE}/representanttaleaktivitet?personid=${personId}&sesjonid=${sesjonId}&format=json`),

  // ── Fase 3: Spørsmål ────────────────────────────────────────
  skriftligeSporsmal: (sesjonId) => fetchJson(`${BASE}/skriftligesporsmal?sesjonid=${sesjonId}&format=json`),
  interpellasjoner:   (sesjonId) => fetchJson(`${BASE}/interpellasjoner?sesjonid=${sesjonId}&format=json`),
  sporretimeSporsmal: (sesjonId) => fetchJson(`${BASE}/sporretimesporsmal?sesjonid=${sesjonId}&format=json`),

  // ── Fase 4: Taler / møtereferater (XML) ─────────────────────
  referatListe: (sesjonId) =>
    fetchText(`${BASE}/publikasjoner?publikasjontype=referat&sesjonid=${sesjonId}`),
  referat: (pubId) =>
    fetchText(`${BASE}/publikasjon?publikasjonid=${pubId}`),
};

// Direktelenke til personbilde (returnerer JPEG, ikke JSON)
const fotoUrl = (personId, str = 'stor') =>
  `${BASE}/personbilde?personid=${personId}&storrelse=${str}`;

// Hjelpefunksjon: strip HTML-tags → ren tekst (API returnerer HTML i forslagstekst-felter)
const stripHtml = (html) => {
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
};

// Beregn forrige sesjon-ID: "2024-2025" → "2023-2024"
const forrigeSesjon = (id) => {
  const m = String(id || '').match(/^(\d{4})-(\d{4})$/);
  if (m) return `${+m[1]-1}-${+m[2]-1}`;
  const m2 = String(id || '').match(/^(\d{4})-(\d{2})$/);
  if (m2) { const å = +m2[1]-1; return `${å}-${String(å+1).slice(-2)}`; }
  return null;
};

// Hjelpefunksjon: parse Stortinget-datoformat /Date(1234567890+0200)/ → lesbar streng
const formatDato = (raw) => {
  if (!raw) return null;
  const ms = Number(String(raw).match(/\d{10,}/)?.[0]);
  if (!ms) return String(raw).slice(0, 10);
  return new Date(ms).toLocaleDateString('nb-NO', { day: '2-digit', month: 'short', year: 'numeric' });
};

// ═══════════════════════════════════════════════════════════════
// SEKSJON 2: DATA-PARSERE
// ═══════════════════════════════════════════════════════════════
const toArray = (val) => {
  if (!val) return [];
  return Array.isArray(val) ? val : [val];
};

const parse = {
  // Fase 1 — bekreftet mot live API
  sesjoner:   (d) => toArray(d?.sesjoner_liste),
  saker:      (d) => toArray(d?.saker_liste),
  voteringer: (d) => toArray(d?.sak_votering_liste),
  voteringsresultat: (d) => toArray(d?.voteringsresultat_liste),
  voteringsforslag:  (d) => toArray(d?.voteringsforslag_liste),
  sak: (d) => d,  // sak-endepunktet returnerer objektet flatt på rot-nivå

  // votering er tall: 1 = ikke_tilstede, 2 = for, 3 = mot
  VOTERING: { 1: 'ikke_tilstede', 2: 'for', 3: 'mot' },

  partiTotaler: (resultater) => {
    const partier = {};
    resultater.forEach(r => {
      const partiId   = r.representant?.parti?.id || 'Ukjent';
      const partiNavn = r.representant?.parti?.navn || partiId;
      if (!partier[partiId]) partier[partiId] = { id: partiId, navn: partiNavn, for: 0, mot: 0, ikke_tilstede: 0 };
      if      (r.votering === 2) partier[partiId].for++;
      else if (r.votering === 3) partier[partiId].mot++;
      else                       partier[partiId].ikke_tilstede++;
    });
    return Object.values(partier).sort((a, b) => b.for + b.mot - (a.for + a.mot));
  },

  // Fase 2 — dagensrepresentanter_liste kan være direkte array eller wrapper
  representanter: (d) => {
    const liste = d?.dagensrepresentanter_liste;
    if (!liste) return [];
    if (Array.isArray(liste)) return liste;
    // Fallback: wrapper med undernøkkel
    return toArray(liste.dagensrepresentant || liste.representant);
  },

  // Taleaktivitet — prøv kjente nøkkelstier
  taleaktivitet: (d) => toArray(
    d?.representant_taleaktivitet_liste ||
    d?.representant_taleaktivitet_oversikt?.representant_taleaktivitet
  ),

  // ── Fase 3: Spørsmål ────────────────────────────────────────
  // Parser alle tre spørsmålstyper til et felles format
  // (defensivt – prøver alle kjente feltnavn fra API)
  sporsmalListe: (d, type) => {
    // Finn første array-verdi i responsen
    const liste = d?.skriftligesporsmal_liste
      || d?.interpellasjoner_liste
      || d?.sporretimesporsmal_liste
      || d?.sporsmal_liste;
    return toArray(liste).map(q => ({
      id:     q.id,
      tittel: q.sporsmal_tittel || q.tittel || q.kortittel
              || String(q.sporsmalstekst || '').slice(0, 120)
              || `Spørsmål #${q.id}`,
      type,
      fra:    q.sporsmal_fra || q.fra_representant || q.representant,
      dato:   q.sendt_dato || q.mottatt_dato || q.dato_sendt,
      status: q.status,
      tekst:  q.sporsmalstekst || q.tekst || q.sporsmal_tekst,
      besvart_dato: q.besvart_dato || q.dato_besvart,
      til:    q.sporsmal_til_minister_tittel || q.til_minister?.tittel || q.til,
      _raw:   q,
    }));
  },

  // Gruppert per parti for partiview
  grupperPerParti: (representanter) => {
    const partier = {};
    representanter.forEach(r => {
      const id   = r.parti?.id || 'Ukjent';
      const navn = r.parti?.navn || id;
      if (!partier[id]) partier[id] = { id, navn, representanter: [] };
      partier[id].representanter.push(r);
    });
    return Object.values(partier)
      .sort((a, b) => b.representanter.length - a.representanter.length);
  },
};

// ── XML-parsere for møtereferater ───────────────────────────────

// Hjelper: "Jonas Gahr Støre (A):" → { navn: "Jonas Gahr Støre", parti: "A" }
const parseNavnParti = (tekst) => {
  const t = (tekst || '').trim();
  const m = t.match(/^(.+?)\s*\(([^)]+)\)\s*:?\s*$/);
  return {
    navn:  m?.[1]?.trim() || t.replace(/\s*\([^)]*\)\s*:?\s*$/, '').trim(),
    parti: m?.[2]?.trim() || '',
  };
};

// Referat-liste XML → [{ id, dato, tittel }]
parse.referatListe = (xmlText) => {
  try {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    if (doc.getElementsByTagName('parsererror').length) {
      console.error('[referatListe] XML parse error:', doc.getElementsByTagName('parsererror')[0]?.textContent);
      return [];
    }
    return Array.from(doc.getElementsByTagName('publikasjon')).map(p => ({
      id:     (p.getElementsByTagName('id')[0]?.textContent     || '').trim(),
      dato:   (p.getElementsByTagName('dato')[0]?.textContent   || '').trim(),
      tittel: (p.getElementsByTagName('tittel')[0]?.textContent || '').trim(),
    })).filter(p => p.id);
  } catch (e) { console.error('[referatListe] error:', e); return []; }
};

// Referat XML → [{ sakId, sakTittel, innlegg: [{ navn, parti, type, tekst }] }]
parse.referatInnlegg = (xmlText) => {
  try {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    if (doc.getElementsByTagName('parsererror').length) {
      console.error('[referatInnlegg] XML parse error:', doc.getElementsByTagName('parsererror')[0]?.textContent);
      return [];
    }

    const parseInnlegg = (els) => Array.from(els).map(el => {
      const { navn, parti } = parseNavnParti(el.getElementsByTagName('navn')[0]?.textContent || '');
      const tekst = Array.from(el.getElementsByTagName('a'))
        .map(a => a.textContent.trim()).filter(Boolean).join('\n\n');
      return navn && tekst ? { navn, parti, tekst, type: el.getAttribute('type') || 'innlegg' } : null;
    }).filter(Boolean);

    const sakEls = doc.getElementsByTagName('sak');
    if (sakEls.length > 0) {
      // Sak-gruppert struktur: <forhandling> → <sak sakid="..."> → <innlegg>
      return Array.from(sakEls).map(sakEl => {
        const sakId     = sakEl.getAttribute('sakid') || sakEl.getAttribute('id') || '';
        const sakTittel = (
          sakEl.getElementsByTagName('saktit')[0]?.textContent ||
          sakEl.getElementsByTagName('tit')[0]?.textContent    ||
          sakEl.getElementsByTagName('tittel')[0]?.textContent || sakId
        ).trim();
        const innlegg = parseInnlegg(sakEl.getElementsByTagName('innlegg'));
        return innlegg.length ? { sakId, sakTittel, innlegg } : null;
      }).filter(Boolean);
    }

    // Flat struktur: alle innlegg direkte under rot, grupper etter sakid-attributt
    const sakMap = new Map();
    Array.from(doc.getElementsByTagName('innlegg')).forEach(el => {
      const sakId = el.getAttribute('sakid') || el.getAttribute('sak') || 'ukjent';
      const { navn, parti } = parseNavnParti(el.getElementsByTagName('navn')[0]?.textContent || '');
      const tekst = Array.from(el.getElementsByTagName('a'))
        .map(a => a.textContent.trim()).filter(Boolean).join('\n\n');
      if (navn && tekst) {
        if (!sakMap.has(sakId)) sakMap.set(sakId, { sakId, sakTittel: sakId, innlegg: [] });
        sakMap.get(sakId).innlegg.push({ navn, parti, tekst, type: el.getAttribute('type') || 'innlegg' });
      }
    });
    return [...sakMap.values()];
  } catch (e) { console.error('[referatInnlegg] error:', e); return []; }
};

// ═══════════════════════════════════════════════════════════════
// SEKSJON 3: CUSTOM HOOK
// ═══════════════════════════════════════════════════════════════
function useData(fetchFn, deps) {
  const [state, setState] = useState({ data: null, loading: false, error: null });
  const lastKey = useRef(null);

  useEffect(() => {
    if (!fetchFn) { setState({ data: null, loading: false, error: null }); return; }
    const key = JSON.stringify(deps);
    lastKey.current = key;
    setState(s => ({ ...s, loading: true, error: null }));
    fetchFn()
      .then(data => { if (lastKey.current === key) setState({ data, loading: false, error: null }); })
      .catch(err  => { if (lastKey.current === key) setState({ data: null, loading: false, error: err.message }); });
  }, deps);

  return state;
}

// SEKSJON 4: UI-PRIMITIVER

  'V':   '#00882e',

};

  'FRP': '#eff4ff', 'FrP': '#eff4ff',

  'V':   '#f0fdf4',
  'KRF': '#fffbeb', 'KrF': '#fffbeb',

};

  3: { label: 'Ikke vedtatt',     farge: 'red'    },

// Sak-typenavnene (type-feltet er tall i API)
const SAK_TYPE_MAP = {
  1: 'Lovsak',
  2: 'Budsjettsak',
  3: 'Alminnelig sak',
};

function Spinner({ liten }) {
  return (
    <div className={`flex items-center justify-center ${liten ? 'p-2' : 'p-10'}`}>
      <div className={`border-2 border-blue-500 border-t-transparent rounded-full animate-spin ${liten ? 'w-4 h-4' : 'w-7 h-7'}`} />
    </div>
  );
}

function Badge({ children, farge = 'gray', liten }) {
  const farger = {
    gray:   'bg-gray-100 text-gray-600',
    green:  'bg-green-100 text-green-700',
    red:    'bg-red-100 text-red-600',
    yellow: 'bg-yellow-100 text-yellow-700',
    blue:   'bg-blue-100 text-blue-700',
  };
  return (
    <span className={`inline-block rounded font-medium ${liten ? 'px-1.5 py-px text-[11px]' : 'px-2 py-0.5 text-xs'} ${farger[farge]}`}>
      {children}
    </span>
  );
}

function StatusBadge({ status }) {
  const key = typeof status === 'number' ? status : (status || '').toLowerCase();
  const s = STATUS_MAP[key] || { label: status != null ? String(status) : '–', farge: 'gray' };
  return <Badge farge={s.farge} liten>{s.label}</Badge>;
}

function PartiBadge({ partiId, partiNavn }) {
  const farge = PARTI_FARGER[partiId] || '#6b7280';
  return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold"
      style={{ background: PARTI_BG[partiId] || '#f3f4f6', color: farge }}>
      <span className="w-1.5 h-1.5 rounded-full inline-block shrink-0" style={{ background: farge }} />
      {partiNavn || partiId}
    </span>
  );
}

function TomtResultat({ tekst }) {
  return <p className="text-sm text-gray-400 p-6 text-center">{tekst}</p>;
}

function FeilMelding({ feil }) {
  return (
    <div className="m-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-600">
      <strong>Feil:</strong> {feil}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SEKSJON 5: VOTERING-KOMPONENTER (Fase 1)
// ═══════════════════════════════════════════════════════════════
function PartiStemmebar({ totaler }) {
  return (
    <div className="space-y-2.5">
      {totaler.map(p => {
        const total = p.for + p.mot + p.ikke_tilstede || 1;
        const forPct  = (p.for / total * 100).toFixed(1);
        const motPct  = (p.mot / total * 100).toFixed(1);
        const fragPct = (p.ikke_tilstede / total * 100).toFixed(1);
        const farge   = PARTI_FARGER[p.id] || '#6b7280';
        return (
          <div key={p.id}>
            <div className="flex justify-between items-center mb-1">
              <span className="text-sm font-semibold" style={{ color: farge }}>{p.navn}</span>
              <span className="text-xs text-gray-400 tabular-nums">
                {p.for > 0 && <span className="text-green-600">{p.for}↑ </span>}
                {p.mot > 0 && <span className="text-red-500">{p.mot}↓ </span>}
                {p.ikke_tilstede > 0 && <span className="text-gray-400">{p.ikke_tilstede}–</span>}
              </span>
            </div>
            <div className="flex h-3 rounded-full overflow-hidden bg-gray-100">
              {p.for > 0 && <div style={{ width: `${forPct}%`, background: '#22c55e' }} title={`For: ${p.for}`} />}
              {p.mot > 0 && <div style={{ width: `${motPct}%`, background: '#ef4444' }} title={`Mot: ${p.mot}`} />}
              {p.ikke_tilstede > 0 && <div style={{ width: `${fragPct}%`, background: '#e2e8f0' }} title={`Fraværende: ${p.ikke_tilstede}`} />}
            </div>
          </div>
        );
      })}
      <div className="flex gap-4 pt-1 text-xs text-gray-400">
        <span><span className="inline-block w-2.5 h-2.5 rounded-sm bg-green-400 mr-1" />For</span>
        <span><span className="inline-block w-2.5 h-2.5 rounded-sm bg-red-400 mr-1" />Mot</span>
        <span><span className="inline-block w-2.5 h-2.5 rounded-sm bg-gray-200 mr-1" />Fraværende</span>
      </div>
    </div>
  );
}

// Blokkanalyse: visuel FOR/MOT-oversikt + kohesjonsindikator
function Blokkanalyse({ totaler, antallFor, antallMot }) {
  const forPartier     = totaler.filter(p => p.for >= p.mot && p.for > 0);
  const motPartier     = totaler.filter(p => p.mot > p.for && p.mot > 0);
  const splittedePartier = totaler.filter(p => p.for > 0 && p.mot > 0);

  const kohesjonsVerdi = (p) => {
    const total = p.for + p.mot;
    if (!total) return 100;
    return Math.round(Math.max(p.for, p.mot) / total * 100);
  };

  const BlokkSeksjon = ({ partier, farge, label, borderColor }) => (
    <div className={`flex-1 rounded-lg border-2 p-3 ${borderColor}`}>
      <p className={`text-xs font-bold uppercase tracking-wide mb-2 ${farge}`}>{label}</p>
      {partier.length === 0
        ? <p className="text-xs text-gray-400 italic">Ingen</p>
        : <div className="space-y-1.5">
            {partier.map(p => {
              const koh = kohesjonsVerdi(p);
              const partiF = PARTI_FARGER[p.id] || '#6b7280';
              return (
                <div key={p.id} className="flex items-center justify-between gap-2">
                  <span className="text-sm font-semibold" style={{ color: partiF }}>{p.navn}</span>
                  <div className="flex items-center gap-1">
                    {koh < 100 && (
                      <span className="text-[11px] text-yellow-600 font-medium">{koh}% samlet</span>
                    )}

function VoteringDetalj({ voteringId }) {

// SEKSJON 5b: PARTIKOHESJONSMATRISE (Fase 4)
// Henter alle voteringsresultater for én sak parallelt,
// beregner hvor ofte hvert partipar stemmer likt.
// ═══════════════════════════════════════════════════════════════
function SakPartimatrise({ sakId }) {
  const [tilstand, setTilstand] = useState({ status: 'idle' }); // idle | loading | done | error

  useEffect(() => {
    let cancelled = false;
    setTilstand({ status: 'loading' });

    API.voteringer(sakId)
      .then(d => {
        const voteringer = parse.voteringer(d);
        if (!voteringer.length) {
          if (!cancelled) setTilstand({ status: 'done', partiIds: [], partiNavn: {}, matrix: {}, antVoteringer: 0 });
          return;
        }
        // Hent alle resultater parallelt
        return Promise.all(
          voteringer.map(v => {
            const id = v.votering_id || v.id;
            return API.voteringsresultat(id)
              .then(res => parse.voteringsresultat(res))
              .catch(() => []);
          })
        ).then(alleResultater => {
          if (cancelled) return;

          // For hvert votering: finn dominerende partistemme (flertall i partiet)
          const partiNavnMap = {};
          const partiStemmerPerVotering = alleResultater.map(resultater => {
            const partiVotes = {};
            resultater.forEach(r => {
              const pid  = r.representant?.parti?.id;
              const pnav = r.representant?.parti?.navn;
              if (!pid) return;
              partiNavnMap[pid] = pnav || pid;
              if (!partiVotes[pid]) partiVotes[pid] = { for: 0, mot: 0 };
              if      (r.votering === 2) partiVotes[pid].for++;
              else if (r.votering === 3) partiVotes[pid].mot++;
            });
            // Bestem partiets stemme basert på flertall
            const stemme = {};
            Object.entries(partiVotes).forEach(([pid, { for: f, mot: m }]) => {
              const tot = f + m;
              if (!tot) return;
              stemme[pid] = f > m ? 2 : m > f ? 3 : 0; // 0 = splittet
            });
            return stemme;
          });

          // Partipar-enighet
          const partiIds = Object.keys(partiNavnMap).sort();
          const matrix   = {};
          partiIds.forEach(a => {
            matrix[a] = {};
            partiIds.forEach(b => {
              let felles = 0, likt = 0;
              partiStemmerPerVotering.forEach(ps => {
                const va = ps[a], vb = ps[b];
                if (va && vb && va !== 0 && vb !== 0) {
                  felles++;
                  if (va === vb) likt++;
                }
              });
              matrix[a][b] = felles >= 2 ? Math.round(likt / felles * 100) : null;
            });
          });

          setTilstand({ status: 'done', partiIds, partiNavn: partiNavnMap, matrix, antVoteringer: voteringer.length });
        });
      })
      .catch(err => { if (!cancelled) setTilstand({ status: 'error', feil: err.message }); });

    return () => { cancelled = true; };
  }, [sakId]);

  if (tilstand.status === 'idle' || tilstand.status === 'loading')
    return <div className="p-6 flex flex-col items-center gap-2 text-sm text-gray-500"><Spinner /><span>Henter {tilstand.status === 'loading' ? 'voteringsresultater' : ''}…</span></div>;
  if (tilstand.status === 'error')
    return <FeilMelding feil={tilstand.feil} />;
  if (!tilstand.partiIds?.length)
    return <TomtResultat tekst="Ingen voteringsdata for denne saken." />;

  const { partiIds, partiNavn, matrix, antVoteringer } = tilstand;

  // HSL-gradient: 0 % → rød (0°), 50 % → gul (60°), 100 % → grønn (120°)
  const cellStyle = (pct, isSelf) => {
    if (isSelf)       return { background: '#f1f5f9', color: '#94a3b8' };
    if (pct === null) return { background: '#f8fafc', color: '#cbd5e1' };
    const hue   = Math.round(pct * 1.2);
    const light = pct >= 70 ? 36 : pct >= 50 ? 42 : 46;
    return { background: `hsl(${hue},62%,${light}%)`, color: 'white' };
  };

  const CELL = 42;

  return (
    <div className="px-5 py-4 border-b border-gray-100">
      <div className="flex items-baseline justify-between mb-4">
        <h3 className="text-sm font-semibold text-gray-700">Partikohesjonsmatrise</h3>
        <span className="text-[11px] text-gray-400">
          {antVoteringer} votering{antVoteringer !== 1 ? 'er' : ''} · % like stemmer
        </span>
      </div>

      <div className="overflow-x-auto">
        <div style={{ display: 'inline-grid', gridTemplateColumns: `76px repeat(${partiIds.length}, ${CELL}px)`, gap: '3px', alignItems: 'center' }}>
          {/* Tom hjørnecelle */}
          <div />
          {/* Kolonneoverskrifter */}
          {partiIds.map(pid => (
            <div key={pid} title={partiNavn[pid]}
              style={{ textAlign: 'center', fontSize: '11px', fontWeight: 700,
                color: PARTI_FARGER[pid] || '#6b7280', paddingBottom: '4px', lineHeight: 1 }}>
              {pid}
            </div>
          ))}

          {/* Rader */}
          {partiIds.map(a => (
            <React.Fragment key={a}>
              <div title={partiNavn[a]}
                style={{ fontSize: '11px', fontWeight: 700, color: PARTI_FARGER[a] || '#6b7280',
                  textAlign: 'right', paddingRight: '8px', lineHeight: 1,
                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                {a}
              </div>
              {partiIds.map(b => {
                const isSelf = a === b;
                const pct    = isSelf ? null : matrix[a][b];
                const s      = cellStyle(pct, isSelf);
                return (
                  <div key={b}
                    title={isSelf
                      ? partiNavn[a]
                      : `${partiNavn[a]} ↔ ${partiNavn[b]}: ${pct !== null ? pct + '%' : 'For lite data'}`}
                    style={{ width: `${CELL}px`, height: `${CELL}px`, borderRadius: '5px',
                      ...s, display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: '12px', fontWeight: 700, cursor: 'default', userSelect: 'none' }}>
                    {isSelf ? '·' : (pct !== null ? pct : '·')}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>

      {/* Fargeforklaring */}
      <div className="flex gap-4 flex-wrap mt-4 pt-3 border-t border-gray-100 text-[11px] text-gray-500">
        {[[108,'85–100% enig'],[84,'70–84%'],[60,'50–69%'],[12,'0–49% uenig']].map(([hue, lbl]) => (
          <span key={lbl} className="flex items-center gap-1.5">
            <span style={{ display:'inline-block', width:'14px', height:'14px', borderRadius:'3px',
              background:`hsl(${hue},62%,42%)` }} />
            {lbl}
          </span>
        ))}
        <span className="flex items-center gap-1.5">
          <span style={{ display:'inline-block', width:'14px', height:'14px', borderRadius:'3px', background:'#f1f5f9' }} />
          For lite data
        </span>
      </div>
    </div>
  );
}

function SakerVisning({ sesjonId, jumpTil }) {
  const [valgtSakId, setValgtSakId] = useState(null);
  useEffect(() => { if (jumpTil?.id) setValgtSakId(jumpTil.id); }, [jumpTil]);

  // Les internDB én gang ved mount for å vise badge på sporede saker
  const internIds = useMemo(() => new Set(Object.keys(internDB.hentAlle())), []);
  const [søk,          setSøk]          = useState('');
  const [statusFilter, setStatusFilter] = useState('alle');
  const [typeFilter,   setTypeFilter]   = useState('alle');
  const [komiteFilter, setKomiteFilter] = useState('alle');
  const [emneFilter,   setEmneFilter]   = useState('alle');

  const { data, loading, error } = useData(
    sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]
  );

  const alleSaker = useMemo(() => parse.saker(data), [data]);

  // Utled unike komitéer og emner fra listen
  const komiteer = useMemo(() => {
    const unik = new Set();
    alleSaker.forEach(s => { if (s.komite?.navn) unik.add(s.komite.navn); });
    return [...unik].sort((a, b) => a.localeCompare(b, 'no'));
  }, [alleSaker]);

  const alleEmner = useMemo(() => {
    const unik = {};
    alleSaker.forEach(s => {
      toArray(s.emne_liste).forEach(e => {
        if (e.navn) unik[e.navn] = true;
      });
    });
    return Object.keys(unik).sort((a, b) => a.localeCompare(b, 'no'));
  }, [alleSaker]);

  // Beregn matchende emner per sak for visning i kort
  const sakMedEmneMatch = useMemo(() => {
    const q = søk.trim().toLowerCase();
    return alleSaker.map(s => {
      const emner = toArray(s.emne_liste);
      const matchende = q
        ? emner.filter(e => (e.navn || '').toLowerCase().includes(q))
        : [];
      return { sak: s, matchendeEmner: matchende };
    });
  }, [alleSaker, søk]);

  const filtrerteMedEmne = useMemo(() => {
    let res = sakMedEmneMatch;
    if (statusFilter !== 'alle') res = res.filter(({ sak: s }) => String(s.status) === statusFilter);
    if (typeFilter   !== 'alle') res = res.filter(({ sak: s }) => String(s.type)   === typeFilter);
    if (komiteFilter !== 'alle') res = res.filter(({ sak: s }) => s.komite?.navn   === komiteFilter);
    if (emneFilter   !== 'alle') res = res.filter(({ sak: s }) =>
      toArray(s.emne_liste).some(e => e.navn === emneFilter)
    );
    if (søk.trim()) {
      const q = søk.toLowerCase();
      res = res.filter(({ sak: s, matchendeEmner }) =>
        (s.tittel      || '').toLowerCase().includes(q) ||
        (s.korttittel  || '').toLowerCase().includes(q) ||
        (s.komite?.navn|| '').toLowerCase().includes(q) ||
        (s.henvisning  || '').toLowerCase().includes(q) ||
        matchendeEmner.length > 0   // har allerede matchende emner
      );
    }
    return res;
  }, [sakMedEmneMatch, søk, statusFilter, typeFilter, komiteFilter, emneFilter]);

  const harFilter = statusFilter !== 'alle' || typeFilter !== 'alle' || komiteFilter !== 'alle' || emneFilter !== 'alle' || søk.trim();

  return (
    <div className="flex items-start">
      {/* Venstre: søk + filtre + liste */}
      <div className={`flex flex-col bg-white border-r border-gray-200 ${valgtSakId ? 'w-[360px] shrink-0' : 'w-full'}`}>

        {/* Sticky filter-seksjon */}
        <div className="sticky top-0 z-10 bg-white" style={{ boxShadow: '0 1px 0 #e5e7eb' }}>
          <div className="px-4 pt-4 pb-3 space-y-2.5">
            {/* Søk */}
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm select-none">🔍</span>
              <input type="text" placeholder="Søk i saker…" value={søk}
                onChange={e => setSøk(e.target.value)}
                className="w-full pl-8 pr-8 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 bg-gray-50 transition" />
              {søk && (
                <button onClick={() => setSøk('')}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">✕</button>
              )}
            </div>
            {/* Status + Type på én rad */}
            <div className="grid grid-cols-2 gap-2">
              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
                className="text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-300">
                <option value="alle">Alle statuser</option>
                <option value="2">Til behandling</option>
                <option value="1">Behandlet</option>
                <option value="3">Ikke vedtatt</option>
                <option value="6">Annet</option>
              </select>
              <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)}
                className="text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-300">
                <option value="alle">Alle typer</option>
                {Object.entries(SAK_TYPE_MAP).map(([v, label]) => (
                  <option key={v} value={v}>{label}</option>
                ))}
              </select>
            </div>
            {/* Komitéfilter */}
            {komiteer.length > 0 && (
              <select value={komiteFilter} onChange={e => setKomiteFilter(e.target.value)}
                className="w-full text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-300">
                <option value="alle">Alle komiteer</option>
                {komiteer.map(k => <option key={k} value={k}>{k}</option>)}
              </select>
            )}
            {/* Emnefilter */}
            {alleEmner.length > 0 && (
              <select value={emneFilter} onChange={e => setEmneFilter(e.target.value)}
                className="w-full text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-300">
                <option value="alle">Alle emner</option>
                {alleEmner.map(e => <option key={e} value={e}>{e}</option>)}
              </select>
            )}
            {/* Teller + nullstill */}
            <div className="flex items-center justify-between">
              <p className="text-[11px] text-gray-400">
                {data ? `${filtrerteMedEmne.length}${harFilter ? ` av ${alleSaker.length}` : ''} saker` : ''}
              </p>
              {harFilter && (
                <button onClick={() => { setSøk(''); setStatusFilter('alle'); setTypeFilter('alle'); setKomiteFilter('alle'); setEmneFilter('alle'); }}
                  className="text-[11px] text-blue-500 hover:text-blue-700">
                  Nullstill ✕
                </button>
              )}
            </div>
          </div>
        </div>

        {/* Liste – scroller naturlig med siden */}
        {loading && <div className="py-10 flex justify-center"><Spinner /></div>}
        {error   && <FeilMelding feil={error} />}
        {!loading && !error && filtrerteMedEmne.length === 0 && (
          <TomtResultat tekst={harFilter ? 'Ingen saker matcher filteret' : 'Ingen saker funnet'} />
        )}
        {filtrerteMedEmne.map(({ sak, matchendeEmner }) => (
          <SakKort key={sak.id} sak={sak}
            valgt={String(sak.id) === String(valgtSakId)}
            matchendeEmner={matchendeEmner}
            erIntern={internIds.has(String(sak.id))}
            onClick={() => setValgtSakId(sak.id)} />
        ))}
      </div>

      {/* Høyre: sticky detalj-panel */}
      {valgtSakId && (
        <div className="flex-1 sticky top-0 overflow-hidden" style={{ height: 'calc(100vh - 45px)' }}>
          <SakDetalj sakId={valgtSakId} onLukk={() => setValgtSakId(null)} />
        </div>
      )}
    </div>
  );
}

// Profilbilde med fallback til initialer
function RepFoto({ personId, navn, stor, profil }) {
  const [feil, setFeil] = useState(false);
  const initialer = navn
    ? navn.split(' ').map(n => n[0]).filter(Boolean).slice(0, 2).join('')
    : '?';

  if (feil) {
    return (
      <div className={`bg-gray-200 flex items-center justify-center font-semibold text-gray-500 shrink-0
        ${profil ? 'w-24 h-32 rounded-xl text-3xl' : stor ? 'w-20 h-20 rounded-full text-2xl' : 'w-9 h-9 rounded-full text-sm'}`}>
        {initialer}
      </div>
    );
  }
  return (
    <img src={fotoUrl(personId, (profil || stor) ? 'stor' : 'lite')}
      alt={navn} onError={() => setFeil(true)}
      className={`object-cover object-top shrink-0
        ${profil ? 'w-24 h-32 rounded-xl' : stor ? 'w-20 h-20 rounded-full' : 'w-9 h-9 rounded-full'}`} />
  );
}

// Taleaktivitet for én representant
function TaleaktivitetFane({ personId, sesjonId }) {
  const { data, loading, error } = useData(
    () => API.taleaktivitet(personId, sesjonId),
    [personId, sesjonId]
  );
  if (loading) return <Spinner />;
  if (error)   return (
    <div className="p-4 text-sm text-gray-400">
      Taleaktivitet ikke tilgjengelig for denne sesjonen.
    </div>
  );

  const aktivitet = parse.taleaktivitet(data);
  if (!aktivitet.length) return <TomtResultat tekst="Ingen taleaktivitet registrert." />;

  const totalSek = aktivitet.reduce((sum, a) => sum + (a.taletid_i_sekunder || a.taletid_sekunder || 0), 0);
  const totalMin = Math.floor(totalSek / 60);
  const totalInnlegg = aktivitet.reduce((sum, a) => sum + (a.antall_innlegg || 0), 0);

  return (
    <div>
      {/* Sammendrag */}
      <div className="grid grid-cols-2 gap-3 p-4 border-b border-gray-100">
        <div className="bg-blue-50 rounded-lg p-3 text-center">
          <div className="text-2xl font-bold text-blue-700">{totalInnlegg}</div>
          <div className="text-xs text-gray-500 mt-0.5">Innlegg</div>
        </div>
        <div className="bg-blue-50 rounded-lg p-3 text-center">
          <div className="text-2xl font-bold text-blue-700">{totalMin > 0 ? `${totalMin}m` : `${totalSek}s`}</div>
          <div className="text-xs text-gray-500 mt-0.5">Taletid</div>
        </div>
      </div>
      {/* Per sak */}
      <div className="divide-y divide-gray-100">
        {aktivitet.map((a, i) => {
          const sek = a.taletid_i_sekunder || a.taletid_sekunder || 0;
          const min = Math.floor(sek / 60);
          const rest = sek % 60;
          return (
            <div key={i} className="px-4 py-3 flex items-start justify-between gap-3">
              <p className="text-sm text-gray-800 leading-snug flex-1 line-clamp-2">
                {a.sak_tittel || a.sak_kortittel || `Sak #${a.sak_id}`}
              </p>
              <div className="text-right shrink-0">
                <div className="text-xs font-semibold text-gray-700 tabular-nums">
                  {min > 0 ? `${min}:${String(rest).padStart(2, '0')}` : `${sek}s`}
                </div>
                {a.antall_innlegg > 0 && (
                  <div className="text-[11px] text-gray-400">{a.antall_innlegg} innlegg</div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── SVG aktivitetsgauge ──────────────────────────────────────
function AktivitetsGauge({ verdi, maks, label, farge }) {
  const pct  = maks > 0 ? Math.min(verdi / maks, 1) : 0;
  const r    = 26;
  const circ = 2 * Math.PI * r;
  return (
    <div className="flex flex-col items-center">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r={r} fill="none" stroke="#e2e8f0" strokeWidth="5" />
        <circle cx="32" cy="32" r={r} fill="none" stroke={farge} strokeWidth="5"
          strokeDasharray={`${circ * pct} ${circ * (1 - pct)}`}
          strokeLinecap="round" transform="rotate(-90 32 32)" />
        <text x="32" y="37" textAnchor="middle" fontSize="13" fontWeight="700" fill={farge}>{verdi}</text>
      </svg>
      <span className="text-[11px] text-gray-500 mt-0.5 text-center leading-tight">{label}</span>
    </div>
  );
}

// ── Interaktivt donutdiagram for tematisk profil ─────────────
const SIRKEL_FARGER = ['#3b82f6','#10b981','#f59e0b','#ef4444',
  '#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#14b8a6','#64748b','#a78bfa'];

function TematiskProfilSirkel({ temaer }) {
  const [hover, setHover] = useState(null);
  const total = temaer.reduce((s, [, c]) => s + c, 0);
  const CX = 80, CY = 80, R = 68, RI = 42;

  let angle = -Math.PI / 2;
  const slices = temaer.map(([navn, count], i) => {
    const pct   = count / total;
    const start = angle;
    const end   = angle + pct * 2 * Math.PI;
    angle = end;
    const x1o = CX + R  * Math.cos(start), y1o = CY + R  * Math.sin(start);
    const x2o = CX + R  * Math.cos(end),   y2o = CY + R  * Math.sin(end);
    const x1i = CX + RI * Math.cos(start), y1i = CY + RI * Math.sin(start);
    const x2i = CX + RI * Math.cos(end),   y2i = CY + RI * Math.sin(end);
    const large = pct > 0.5 ? 1 : 0;
    const d = `M${x1o},${y1o} A${R},${R} 0 ${large} 1 ${x2o},${y2o} L${x2i},${y2i} A${RI},${RI} 0 ${large} 0 ${x1i},${y1i} Z`;
    return { navn, count, pct, d, farge: SIRKEL_FARGER[i % SIRKEL_FARGER.length] };
  });

  const hoverSlice = hover !== null ? slices[hover] : null;

  return (
    <div className="flex gap-3 items-start">
      {/* SVG donut */}
      <svg width="160" height="160" viewBox="0 0 160 160" className="shrink-0">
        {slices.map((s, i) => (
          <path key={i} d={s.d} fill={s.farge}
            style={{
              opacity: hover === null ? 1 : hover === i ? 1 : 0.35,
              transform: hover === i ? `scale(1.04)` : 'scale(1)',
              transformOrigin: `${CX}px ${CY}px`,
              transition: 'opacity 0.15s, transform 0.15s',
              cursor: 'pointer',
            }}
            onMouseEnter={() => setHover(i)}
            onMouseLeave={() => setHover(null)}
          />
        ))}
        {/* Senter-tekst */}
        {hoverSlice ? (
          <>
            <text x={CX} y={CY - 8} textAnchor="middle" fontSize="10" fontWeight="600" fill="#1f2937"
              style={{ pointerEvents: 'none' }}>
              {hoverSlice.navn.length > 14 ? hoverSlice.navn.slice(0, 13) + '…' : hoverSlice.navn}
            </text>
            <text x={CX} y={CY + 6} textAnchor="middle" fontSize="9" fill="#6b7280"
              style={{ pointerEvents: 'none' }}>
              {hoverSlice.count} saker
            </text>
            <text x={CX} y={CY + 18} textAnchor="middle" fontSize="9" fill="#9ca3af"
              style={{ pointerEvents: 'none' }}>
              {Math.round(hoverSlice.pct * 100)}%
            </text>
          </>
        ) : (
          <>
            <text x={CX} y={CY - 4} textAnchor="middle" fontSize="18" fontWeight="700" fill="#1f2937"
              style={{ pointerEvents: 'none' }}>
              {total}
            </text>
            <text x={CX} y={CY + 12} textAnchor="middle" fontSize="9" fill="#9ca3af"
              style={{ pointerEvents: 'none' }}>
              saker totalt
            </text>
          </>
        )}
      </svg>
      {/* Legend */}
      <div className="flex-1 min-w-0 space-y-1 pt-1">
        {slices.slice(0, 10).map((s, i) => (
          <div key={i} className="flex items-center gap-1.5 cursor-default"
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
            style={{ opacity: hover === null ? 1 : hover === i ? 1 : 0.45, transition: 'opacity 0.15s' }}>
            <span className="w-2 h-2 rounded-full shrink-0" style={{ background: s.farge }} />
            <span className="text-[10px] text-gray-700 truncate flex-1 leading-tight" title={s.navn}>{s.navn}</span>
            <span className="text-[10px] text-gray-400 shrink-0">{s.count}</span>
            <span className="text-[10px] text-gray-300 shrink-0 w-6 text-right">{Math.round(s.pct * 100)}%</span>
          </div>
        ))}
        {slices.length > 10 && (
          <p className="text-[10px] text-gray-400 pl-3.5">+ {slices.length - 10} temaer til</p>
        )}
      </div>
    </div>
  );
}

// ── Oversikt-fane: stats + tematisk profil + komiteer + parti ─
function RepOversiktFane({ rep, sesjonId }) {
  const { data: taleData } = useData(() => API.taleaktivitet(rep.id, sesjonId), [rep.id, sesjonId]);
  const { data: sakerData, loading: sakerLoad } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);

  const aktivitet = useMemo(() => parse.taleaktivitet(taleData), [taleData]);
  const alleSaker = useMemo(() => parse.saker(sakerData), [sakerData]);

  // Repens egne saker
  const egneForslag  = useMemo(() => alleSaker.filter(s => toArray(s.forslagstiller_liste).some(f => f.id === rep.id)), [alleSaker, rep.id]);
  const egneSaksord  = useMemo(() => alleSaker.filter(s => toArray(s.saksordfoerer_liste) .some(f => f.id === rep.id)), [alleSaker, rep.id]);
  const antForslag   = egneForslag.length;
  const antSaksord   = egneSaksord.length;
  const totalInnlegg = aktivitet.reduce((s, a) => s + (a.antall_innlegg || 0), 0);
  const totalMin     = Math.floor(aktivitet.reduce((s, a) => s + (a.taletid_i_sekunder || a.taletid_sekunder || 0), 0) / 60);

  // Dynamiske maxverdier: høyeste i sesjonen gir kontekst
  const sessionMaxForslag = useMemo(() => {
    const counts = {};
    alleSaker.forEach(s => toArray(s.forslagstiller_liste).forEach(f => { if (f.id) counts[f.id] = (counts[f.id]||0)+1; }));
    return Math.max(1, ...Object.values(counts));
  }, [alleSaker]);
  const sessionMaxSaksord = useMemo(() => {
    const counts = {};
    alleSaker.forEach(s => toArray(s.saksordfoerer_liste).forEach(f => { if (f.id) counts[f.id] = (counts[f.id]||0)+1; }));
    return Math.max(1, ...Object.values(counts));
  }, [alleSaker]);

  // Tematisk profil: emneord fra saker rep er involvert i, rangert etter frekvens
  const temaer = useMemo(() => {
    const freq = {};
    [...egneForslag, ...egneSaksord].forEach(s => {
      toArray(s.emne_liste).forEach(e => {
        if (e.navn) freq[e.navn] = (freq[e.navn] || 0) + 1;
      });
    });
    return Object.entries(freq)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 12);
  }, [egneForslag, egneSaksord]);

  const komiteer = toArray(rep.komiteer_liste?.komite || rep.komiteer_liste);
  const partiId  = rep.parti?.id;
  const partiF   = PARTI_FARGER[partiId] || '#6b7280';
  const partiBg  = PARTI_BG[partiId]    || '#f9fafb';
  const fodt     = rep.foedselsdato ? new Date(Number(rep.foedselsdato.match(/\d+/)?.[0])).getFullYear() : null;
  const fylke    = rep.fylke?.navn || rep.fylke;
  const maksTema = temaer[0]?.[1] || 1;

  return (
    <div className="p-4 space-y-5">

      {/* Parti + meta — øverst for rask kontekst */}
      <div className="rounded-xl overflow-hidden border" style={{ borderColor: `${partiF}30` }}>
        <div style={{ background: partiF, height: '3px' }} />
        <div className="px-3 py-2.5" style={{ background: partiBg }}>
          <div className="flex items-center gap-2 mb-1.5">
            <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: partiF }} />
            <span className="text-sm font-bold" style={{ color: partiF }}>{rep.parti?.navn || partiId}</span>
          </div>
          <div className="grid grid-cols-2 gap-x-4 gap-y-0.5 text-xs text-gray-600">
            {fylke && <span><span className="text-gray-400">Valgkrets </span>{fylke}</span>}
            {fodt  && <span><span className="text-gray-400">Født </span>{fodt}</span>}
            {rep.kjoenn && <span><span className="text-gray-400">Kjønn </span>{rep.kjoenn === 'mann' ? 'Mann' : 'Kvinne'}</span>}
            {rep.vara_representant && <span className="text-yellow-600 font-medium">Vara</span>}
          </div>
        </div>
      </div>

      {/* Aktivitetsgauger med sesjonskontekst */}
      <div>
        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Aktivitet denne sesjonen</p>
        {sakerLoad
          ? <div className="flex justify-center py-3"><Spinner liten /></div>
          : <div className="grid grid-cols-2 gap-2">
              {[
                { verdi: antForslag,   maks: sessionMaxForslag, label: 'Forslag',          farge: '#3b82f6', sub: `av maks ${sessionMaxForslag} i sesjonen` },
                { verdi: antSaksord,   maks: sessionMaxSaksord, label: 'Saksordførerskap', farge: '#8b5cf6', sub: `av maks ${sessionMaxSaksord} i sesjonen` },
                { verdi: totalInnlegg, maks: Math.max(totalInnlegg, 1), label: 'Innlegg i salen',  farge: '#10b981', sub: 'denne sesjonen' },
                { verdi: totalMin,     maks: Math.max(totalMin, 1),     label: 'Min taletid',       farge: '#f59e0b', sub: 'denne sesjonen' },
              ].map(({ verdi, maks, label, farge, sub }) => (
                <div key={label} className="bg-gray-50 rounded-xl p-3 flex items-center gap-3">
                  <AktivitetsGauge verdi={verdi} maks={maks} label="" farge={farge} />
                  <div className="min-w-0">
                    <p className="text-xs font-semibold text-gray-700 leading-tight">{label}</p>
                    <p className="text-[10px] text-gray-400 mt-0.5 leading-tight">{sub}</p>
                  </div>
                </div>
              ))}
            </div>
        }
      </div>

      {/* Tematisk profil */}
      {!sakerLoad && temaer.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Tematisk profil</p>
          <TematiskProfilSirkel temaer={temaer} />
        </div>
      )}
      {!sakerLoad && temaer.length === 0 && antForslag + antSaksord === 0 && (
        <p className="text-xs text-gray-400 text-center py-2">Ingen registrerte forslag eller saksordførerskap denne sesjonen.</p>
      )}

      {/* Komiteer */}
      {komiteer.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Komiteer</p>
          <div className="flex flex-wrap gap-1.5">
            {komiteer.map((k, i) => (
              <span key={i} className="text-xs text-gray-700 bg-gray-100 rounded-lg px-2.5 py-1.5 border border-gray-200">
                {k.navn || k.komite_navn || k.id}
              </span>
            ))}
          </div>
        </div>
      )}

      {/* Fast vara for */}
      {rep.fast_vara_for && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Fast vara for</p>
          <p className="text-sm text-gray-700">
            {[rep.fast_vara_for?.fornavn, rep.fast_vara_for?.etternavn].filter(Boolean).join(' ') || rep.fast_vara_for?.id}
          </p>
        </div>
      )}
    </div>
  );
}

// ── Saker-fane: forslag + saksordførerskap i én tab med toggle ──
function RepSakerFane({ rep, sesjonId }) {
  const [mode, setMode] = useState('forslag');

  const alleSaker = useMemo(() => parse.saker(data), [data]);
  const forslag   = useMemo(() => alleSaker.filter(s => toArray(s.forslagstiller_liste).some(f => f.id === rep.id)), [alleSaker, rep.id]);
  const saksord   = useMemo(() => alleSaker.filter(s => toArray(s.saksordfoerer_liste) .some(f => f.id === rep.id)), [alleSaker, rep.id]);
  const visSaker  = mode === 'forslag' ? forslag : saksord;

  if (loading) return <Spinner />;
  if (error)   return <FeilMelding feil={error} />;

  return (
    <div>
      {/* Toggle */}
      <div className="flex border-b border-gray-100 bg-gray-50 shrink-0">
        {[
          { id: 'forslag', label: 'Forslag', n: forslag.length },
          { id: 'saksord', label: 'Saksordførerskap', n: saksord.length },
        ].map(t => (
          <button key={t.id} onClick={() => setMode(t.id)}
            className={`flex-1 py-2 text-xs font-medium transition-colors border-b-2 ${
              mode === t.id
                ? 'border-blue-500 text-blue-700 bg-white'
                : 'border-transparent text-gray-400 hover:text-gray-700'

            <span className={`ml-1.5 px-1.5 py-px rounded-full text-[10px] font-bold ${
              mode === t.id ? 'bg-blue-100 text-blue-600' : 'bg-gray-200 text-gray-500'
            }`}>{t.n}</span>
          </button>
        ))}
      </div>

        ? <TomtResultat tekst={mode === 'forslag' ? 'Ingen forslag fremmet denne sesjonen.' : 'Ingen saksordførerskap denne sesjonen.'} />
        : <div className="divide-y divide-gray-100">
            {visSaker.map(sak => (
              <div key={sak.id} className="px-4 py-3 hover:bg-gray-50 transition-colors">
                <p className="text-sm text-gray-800 leading-snug">{sak.korttittel || sak.tittel || `Sak #${sak.id}`}</p>
                <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                  <StatusBadge status={sak.status} />
                  {sak.type && <span className="text-[11px] text-gray-400">{SAK_TYPE_MAP[sak.type] || ''}</span>}
                  {sak.komite?.navn && <span className="text-[11px] text-gray-400">· {sak.komite.navn}</span>}
                </div>
                {toArray(sak.emne_liste).length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-1.5">
                    {toArray(sak.emne_liste).slice(0, 4).map(e => (
                      <span key={e.id} className="text-[10px] px-1.5 py-px rounded bg-gray-100 text-gray-500">{e.navn}</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
      }
    </div>
  );
}

// ── Spørsmål stilt av representanten ─────────────────────────
function RepSporsmalFane({ rep, sesjonId }) {
  const { data: skrData,  loading: l1 } = useData(sesjonId ? () => API.skriftligeSporsmal(sesjonId).then(d => parse.sporsmalListe(d, 'skriftlige'))      : null, [sesjonId]);
  const { data: intData,  loading: l2 } = useData(sesjonId ? () => API.interpellasjoner(sesjonId).then(d => parse.sporsmalListe(d, 'interpellasjoner'))   : null, [sesjonId]);
  const { data: spørData, loading: l3 } = useData(sesjonId ? () => API.sporretimeSporsmal(sesjonId).then(d => parse.sporsmalListe(d, 'sporretimen'))      : null, [sesjonId]);

  const sporsmal = useMemo(() => {
    return [...(skrData || []), ...(intData || []), ...(spørData || [])]
      .filter(s => s.fra?.id === rep.id)
      .sort((a, b) => {
        const aMs = Number(String(a.dato || 0).match(/\d{10,}/)?.[0] || 0);
        const bMs = Number(String(b.dato || 0).match(/\d{10,}/)?.[0] || 0);
        return bMs - aMs;
      });
  }, [skrData, intData, spørData, rep.id]);

  if ((l1 || l2 || l3) && !sporsmal.length) return <Spinner />;
  if (!sporsmal.length) return <TomtResultat tekst="Ingen spørsmål registrert for denne sesjonen." />;

  return (
    <div>
      <p className="text-[11px] text-gray-400 px-4 py-2 border-b border-gray-100">{sporsmal.length} spørsmål</p>
      <div className="divide-y divide-gray-100">
        {sporsmal.map((sp, i) => {
          const statusInfo = SPORSMAL_STATUS[String(sp.status ?? '').toLowerCase()] || { label: String(sp.status ?? '–'), farge: 'gray' };
          const typeLabel  = SPORSMAL_TYPER.find(t => t.id === sp.type)?.label || sp.type;
          return (
            <div key={i} className="px-4 py-3">
              <p className="text-sm text-gray-800 leading-snug line-clamp-2">{sp.tittel}</p>
              <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                <Badge farge={statusInfo.farge} liten>{statusInfo.label}</Badge>
                {typeLabel && <Badge liten>{typeLabel}</Badge>}
                {sp.dato && <span className="text-[11px] text-gray-400">{formatDato(sp.dato)}</span>}
                {sp.til   && <span className="text-[11px] text-gray-400">→ {sp.til}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Lojalitet og fravær ───────────────────────────────────────
function RepLojalitetFane({ rep, sesjonId }) {
  const [analyse, setAnalyse]     = useState(null);
  const [kjører, setKjører]       = useState(false);
  const [feil, setFeil]           = useState(null);
  const [progress, setProgress]   = useState({ tekst: '', pst: 0 });
  const analyseVersjon             = React.useRef(0);
  const partiId = rep.parti?.id;

  // Nullstill ved representantbytte
  useEffect(() => { setAnalyse(null); setFeil(null); }, [rep.id]);

  const kjørAnalyse = async () => {
    if (!sesjonId || !partiId) return;
    const versjon = ++analyseVersjon.current;
    setKjører(true); setFeil(null); setProgress({ tekst: 'Henter saker…', pst: 5 });
    try {
      // 1. Hent saker for sesjonen (trolig allerede cachet)
      const sakerData = await API.saker(sesjonId);
      if (analyseVersjon.current !== versjon) return;
      const alleSaker = parse.saker(sakerData);
      // Velg lovsaker (1) og budsjettsaker (2) — disse har oftest voteringer
      const utvalg = alleSaker.filter(s => s.type === 1 || s.type === 2).slice(0, 8);

      setProgress({ tekst: `Henter voteringer for ${utvalg.length} saker…`, pst: 15 });

      // 2. Hent voteringslister i parallell (semaphore håndterer rate limit)
      const voteringsLister = await Promise.all(
        utvalg.map(s => API.voteringer(s.id).catch(() => null))
      );
      if (analyseVersjon.current !== versjon) return;

      const alleVoteringer = voteringsLister
        .flatMap(d => parse.voteringer(d))
        .slice(0, 20); // maks 20 individuelle voteringer

      setProgress({ tekst: `Analyserer ${alleVoteringer.length} voteringer…`, pst: 30 });

      if (!alleVoteringer.length) {
        setAnalyse({ antVoteringer: 0, fraværPst: null, lojalitetPst: null });
        return;
      }

      // 3. Hent voteringsresultat for alle voteringer
      let done = 0;
      const resultater = await Promise.all(
        alleVoteringer.map(v => {
          const vid = v.votering_id || v.id;
          return API.voteringsresultat(vid)
            .then(d => { done++; setProgress({ tekst: `Votering ${done}/${alleVoteringer.length}…`, pst: 30 + Math.floor(done / alleVoteringer.length * 60) }); return parse.voteringsresultat(d); })
            .catch(() => null);
        })
      );

      // 4. Beregn statistikk per votering
      let antFravær = 0, antMedParti = 0, antMotParti = 0, talt = 0;
      const avvik = []; // voteringer der rep stemte mot parti

      for (let i = 0; i < alleVoteringer.length; i++) {
        const stemmer = resultater[i];
        if (!stemmer) continue;
        const repStemme = stemmer.find(s => s.representant?.id === rep.id);
        if (!repStemme) continue;
        const repV = repStemme.votering; // 1=fravær, 2=for, 3=mot
        talt++;
        if (repV === 1) { antFravær++; continue; }
        // Finn partimajoritet (ignorer fraværende)
        const pstm = stemmer.filter(s => s.representant?.parti?.id === partiId && s.votering !== 1);
        const f = pstm.filter(s => s.votering === 2).length;
        const m = pstm.filter(s => s.votering === 3).length;
        if (f + m === 0) continue;
        const majoritet = f >= m ? 2 : 3;
        if (repV === majoritet) antMedParti++;
        else { antMotParti++; avvik.push({ id: alleVoteringer[i].votering_id || alleVoteringer[i].id, repV, majoritet }); }
      }

      // 5. Kryss-parti stemme-likhet
      const samstemt = {};
      for (let i = 0; i < alleVoteringer.length; i++) {
        const stemmer = resultater[i];
        if (!stemmer) continue;
        const repStemme = stemmer.find(s => s.representant?.id === rep.id);
        if (!repStemme || repStemme.votering === 1) continue;
        const repV = repStemme.votering;
        stemmer.forEach(s => {
          const oid = s.representant?.id;
          if (!oid || oid === rep.id || s.votering === 1) return;
          if (!samstemt[oid]) samstemt[oid] = { rep: s.representant, felles: 0, like: 0 };
          samstemt[oid].felles++;
          if (s.votering === repV) samstemt[oid].like++;
        });
      }
      const krysspPartiAllierte = Object.values(samstemt)
        .filter(s => s.rep?.parti?.id !== partiId && s.felles >= 5)
        .map(s => ({ ...s, pst: Math.round(s.like / s.felles * 100) }))
        .sort((a, b) => b.pst - a.pst)
        .slice(0, 8);

      if (analyseVersjon.current !== versjon) return;
      setAnalyse({
        antVoteringer: talt,
        antFravær,
        fraværPst: talt > 0 ? Math.round(antFravær / talt * 100) : 0,
        antMedParti, antMotParti,
        lojalitetPst: antMedParti + antMotParti > 0
          ? Math.round(antMedParti / (antMedParti + antMotParti) * 100) : null,
        avvik,
        krysspPartiAllierte,
        analyserteVoteringer: alleVoteringer.length,
      });
    } catch (e) {
      if (analyseVersjon.current === versjon) setFeil(e.message);
    } finally {
      if (analyseVersjon.current === versjon) setKjører(false);
    }
  };

  // Auto-start når fanen åpnes (etter at kjørAnalyse er definert)
  useEffect(() => {
    if (sesjonId && partiId) kjørAnalyse();
  }, [rep.id, sesjonId]); // eslint-disable-line react-hooks/exhaustive-deps

  // ── Tilstander ──────────────────────────────────────────────
  if (kjører) return (
    <div className="p-6 flex flex-col items-center gap-4">
      <Spinner />
      <div className="w-full max-w-xs">
        <div className="flex justify-between text-xs text-gray-400 mb-1">
          <span>{progress.tekst}</span>
          <span>{progress.pst}%</span>
        </div>
        <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
          <div className="h-full bg-blue-500 rounded-full transition-all duration-300" style={{ width: `${progress.pst}%` }} />
        </div>
      </div>
    </div>
  );

  if (feil) return <FeilMelding feil={feil} />;

  if (!analyse) return <div className="p-6 flex justify-center"><Spinner /></div>;

  const { antVoteringer, antFravær, fraværPst, lojalitetPst, antMedParti, antMotParti, avvik, analyserteVoteringer } = analyse;
  const fraværFarge = fraværPst > 15 ? '#ef4444' : fraværPst > 8 ? '#f59e0b' : '#10b981';
  const lojalFarge  = lojalitetPst === null ? '#9ca3af'
    : lojalitetPst >= 95 ? '#10b981' : lojalitetPst >= 85 ? '#3b82f6' : lojalitetPst >= 70 ? '#f59e0b' : '#ef4444';

  const fraværLabel  = fraværPst <= 3 ? 'Svært god oppmøte' : fraværPst <= 8 ? 'God oppmøte' : fraværPst <= 15 ? 'Moderat fravær' : 'Høyt fravær';
  const lojalLabel   = lojalitetPst === null ? 'Utilstrekkelig data' : lojalitetPst >= 97 ? 'Svært lojal' : lojalitetPst >= 90 ? 'Lojal' : lojalitetPst >= 75 ? 'Noe avvikende' : 'Sterkt avvikende';

  return (
    <div className="p-4 space-y-4">
      <p className="text-[11px] text-gray-400">Basert på {analyserteVoteringer} voteringer · {antVoteringer} der {[rep.fornavn, rep.etternavn].filter(Boolean).join(' ')} deltok eller var fraværende</p>

      {/* Gauge-rad */}
      <div className="grid grid-cols-2 gap-3">
        {/* Fravær */}
        <div className="bg-gray-50 rounded-xl p-3 flex flex-col items-center gap-1.5">
          <AktivitetsGauge verdi={fraværPst} maks={100} label="% Fravær" farge={fraværFarge} />
          <p className="text-[11px] text-center text-gray-500">{fraværLabel}</p>
          <p className="text-[10px] text-gray-400">{antFravær} av {antVoteringer}</p>
        </div>
        {/* Lojalitet */}
        <div className="bg-gray-50 rounded-xl p-3 flex flex-col items-center gap-1.5">
          <AktivitetsGauge verdi={lojalitetPst ?? 0} maks={100} label="% Med parti" farge={lojalFarge} />
          <p className="text-[11px] text-center text-gray-500">{lojalLabel}</p>
          <p className="text-[10px] text-gray-400">{antMedParti} med · {antMotParti} mot</p>
        </div>
      </div>

      {/* Avvik */}
      {avvik.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">
            Avvik fra partilinje ({avvik.length})
          </p>
          <div className="space-y-1.5">
            {avvik.slice(0, 10).map((a, i) => (
              <div key={i} className="flex items-center gap-2 text-xs text-gray-600 bg-red-50 rounded-lg px-3 py-1.5">
                <span className="text-red-400 shrink-0">⚡</span>
                <span className="flex-1 min-w-0">
                  Stemte <strong>{a.repV === 2 ? 'for' : 'mot'}</strong> mens partiet stemte <strong>{a.majoritet === 2 ? 'for' : 'mot'}</strong>
                </span>
              </div>
            ))}
            {avvik.length > 10 && (
              <p className="text-[11px] text-gray-400 pl-1">+ {avvik.length - 10} til…</p>
            )}
          </div>
        </div>
      )}

      {avvik.length === 0 && lojalitetPst !== null && (
        <div className="bg-green-50 rounded-xl p-3 text-center">
          <p className="text-xs text-green-700 font-medium">Ingen avvik registrert</p>
          <p className="text-[11px] text-green-500 mt-0.5">Stemte alltid med partilinje i analyserte voteringer</p>
        </div>
      )}

      {/* Kryss-parti allierte */}
      {analyse.krysspPartiAllierte?.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">
            Hvem stemmer likt? (kryss-parti)
          </p>
          <div className="space-y-1.5">
            {analyse.krysspPartiAllierte.map((a, i) => {
              const navn  = [a.rep.fornavn, a.rep.etternavn].filter(Boolean).join(' ');
              const pF    = PARTI_FARGER[a.rep.parti?.id] || '#6b7280';
              const score = a.pst >= 80 ? '#10b981' : a.pst >= 65 ? '#3b82f6' : '#9ca3af';
              return (
                <div key={a.rep.id || i} className="flex items-center gap-2.5 bg-gray-50 rounded-lg px-3 py-2">
                  <span className="text-[11px] text-gray-300 w-4 shrink-0">{i+1}</span>
                  <RepFoto personId={a.rep.id} navn={navn} />
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-medium text-gray-800 truncate">{navn}</p>
                    <p className="text-[10px] font-semibold" style={{ color: pF }}>{a.rep.parti?.navn || a.rep.parti?.id}</p>
                  </div>
                  <div className="text-right shrink-0">
                    <p className="text-sm font-bold" style={{ color: score }}>{a.pst}%</p>
                    <p className="text-[10px] text-gray-400">{a.felles} votert</p>
                  </div>
                </div>
              );
            })}
          </div>
          <p className="text-[10px] text-gray-400 mt-1.5 pl-1">Repr. fra andre partier med ≥5 felles voteringer</p>
        </div>
      )}

      <button onClick={() => { setAnalyse(null); setFeil(null); }}
        className="w-full text-[11px] text-blue-500 hover:text-blue-700 py-1">
        Kjør ny analyse
      </button>
    </div>
  );
}

// ── Utvikling: sesjonsammenligning for representant ───────────
function RepUtviklingFane({ rep, sesjonId }) {
  const prevId = forrigeSesjon(sesjonId);

  const { data: sakerNå,  loading: l1 } = useData(sesjonId ? () => API.saker(sesjonId) : null, [sesjonId]);
  const { data: sakerFør, loading: l2 } = useData(prevId   ? () => API.saker(prevId)   : null, [prevId]);
  const { data: skrNå   } = useData(sesjonId ? () => API.skriftligeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: intNå   } = useData(sesjonId ? () => API.interpellasjoner(sesjonId)    : null, [sesjonId]);
  const { data: spørNå  } = useData(sesjonId ? () => API.sporretimeSporsmal(sesjonId)  : null, [sesjonId]);
  const { data: skrFør  } = useData(prevId   ? () => API.skriftligeSporsmal(prevId)   : null, [prevId]);
  const { data: intFør  } = useData(prevId   ? () => API.interpellasjoner(prevId)     : null, [prevId]);
  const { data: spørFør } = useData(prevId   ? () => API.sporretimeSporsmal(prevId)   : null, [prevId]);

  const stats = useMemo(() => {
    const calcStats = (sakerData, skr, int, spør) => {
      const saker    = parse.saker(sakerData);
      const sporsmal = [
        ...parse.sporsmalListe(skr,  'skriftlige'),
        ...parse.sporsmalListe(int,  'interpellasjoner'),
        ...parse.sporsmalListe(spør, 'sporretimen'),
      ].filter(s => s.fra?.id === rep.id);
      const forslag = saker.filter(s => toArray(s.forslagstiller_liste).some(f => f.id === rep.id));
      const temaFreq = {};
      forslag.forEach(s => toArray(s.emne_liste).forEach(e => {
        if (e.navn) temaFreq[e.navn] = (temaFreq[e.navn] || 0) + 1;
      }));
      return { forslag: forslag.length, spm: sporsmal.length, temaFreq };
    };
    const nå  = calcStats(sakerNå,  skrNå,  intNå,  spørNå);
    const før = calcStats(sakerFør, skrFør, intFør, spørFør);
    const alleTema = new Set([...Object.keys(nå.temaFreq), ...Object.keys(før.temaFreq)]);
    const temaDelta = [...alleTema]
      .map(t => ({ tema: t, nå: nå.temaFreq[t] || 0, før: før.temaFreq[t] || 0 }))
      .sort((a, b) => (b.nå - b.før) - (a.nå - a.før))
      .slice(0, 12);
    return { nå, før, temaDelta };
  }, [sakerNå, sakerFør, skrNå, skrFør, intNå, intFør, spørNå, spørFør, rep.id]);

  if (l1 || l2) return <Spinner />;
  if (!prevId) return <TomtResultat tekst="Ingen forrige sesjon å sammenligne med." />;

  const Delta = ({ nå, før }) => {
    const d = nå - før;
    if (d === 0) return <span className="text-gray-400 text-xs">→</span>;
    return d > 0
      ? <span className="text-emerald-600 text-xs font-bold">+{d} ↑</span>
      : <span className="text-red-500 text-xs font-bold">{d} ↓</span>;
  };

  const maks = Math.max(1, ...stats.temaDelta.map(t => Math.max(t.nå, t.før)));

  return (
    <div className="p-4 space-y-5">
      <p className="text-[11px] text-gray-400 font-medium">{prevId} → {sesjonId}</p>

      {/* Aktivitets-sammenligning */}
      <div className="grid grid-cols-2 gap-3">
        {[
          { lbl: 'Forslag fremmet', nå: stats.nå.forslag, før: stats.før.forslag },
          { lbl: 'Spørsmål stilt',  nå: stats.nå.spm,     før: stats.før.spm     },
        ].map(({ lbl, nå, før }) => (
          <div key={lbl} className="bg-gray-50 rounded-xl p-3 text-center">
            <p className="text-[11px] text-gray-500 font-medium mb-2">{lbl}</p>
            <div className="flex items-center justify-center gap-3">
              <div>
                <p className="text-xl font-bold text-gray-300">{før}</p>
                <p className="text-[10px] text-gray-400">{prevId}</p>
              </div>
              <Delta nå={nå} før={før} />
              <div>
                <p className="text-xl font-bold text-blue-600">{nå}</p>
                <p className="text-[10px] text-gray-400">{sesjonId}</p>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Emneord utvikling */}
      {stats.temaDelta.length > 0 && (
        <div>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Tematisk utvikling</p>
          <div className="space-y-2">
            {stats.temaDelta.map(({ tema, nå, før }) => {
              const erNy       = nå > 0 && før === 0;
              const erBortfalt = nå === 0 && før > 0;
              return (
                <div key={tema} className="flex items-center gap-2">
                  <span className={`text-[10px] w-2 shrink-0 font-bold ${erNy ? 'text-emerald-500' : erBortfalt ? 'text-red-400' : 'text-gray-200'}`}>
                    {erNy ? '●' : erBortfalt ? '○' : '·'}
                  </span>
                  <span className="text-xs text-gray-700 w-36 shrink-0 truncate" title={tema}>{tema}</span>
                  <div className="flex-1 flex items-center gap-1 min-w-0">
                    {/* Forrige sesjon — grå, tynnere */}
                    <div className="flex-1 h-1 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full bg-gray-300" style={{ width: `${Math.round(før/maks*100)}%` }} />
                    </div>
                    {/* Nåværende sesjon — blå, tykkere */}
                    <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full bg-blue-500" style={{ width: `${Math.round(nå/maks*100)}%` }} />
                    </div>
                  </div>
                  <span className={`text-[10px] w-5 text-right shrink-0 font-medium ${
                    erNy ? 'text-emerald-500' : erBortfalt ? 'text-red-400' : 'text-gray-400'
                  }`}>{nå}</span>
                </div>
              );
            })}
          </div>
          <div className="flex gap-4 mt-2.5 text-[10px] text-gray-400 flex-wrap">
            <span className="text-emerald-500">● Nytt tema</span>
            <span className="text-red-400">○ Bortfalt</span>
            <span>Grå = {prevId} · Blå = {sesjonId}</span>
          </div>
        </div>
      )}

      {stats.nå.forslag === 0 && stats.nå.spm === 0 && stats.før.forslag === 0 && stats.før.spm === 0 && (
        <TomtResultat tekst="Ingen registrert aktivitet i disse sesjonene." />
      )}
    </div>
  );
}

// Hoved-view: representanter
function RepresentanterVisning({ sesjonId, jumpTil }) {
  const [valgtRep, setValgtRep] = useState(null);
  const [søk, setSøk]           = useState('');
  const [partiFilter, setPartiFilter] = useState('alle');

  // Hopp direkte til en representant (f.eks. fra partiview)
  useEffect(() => {
    if (jumpTil) {
      setValgtRep(jumpTil);
      if (jumpTil.parti?.id) setPartiFilter(jumpTil.parti.id);
    }
  }, [jumpTil]);

  const { data, loading, error } = useData(() => API.dagensRepresentanter(), []);
  const alleRep = useMemo(() => parse.representanter(data), [data]);

  // Unik partiliste
  const partier = useMemo(() => {
    const unik = {};
    alleRep.forEach(r => {
      if (r.parti?.id) unik[r.parti.id] = r.parti.navn || r.parti.id;
    });
    return Object.entries(unik).sort((a, b) => a[1].localeCompare(b[1], 'no'));
  }, [alleRep]);

  const filtrerte = useMemo(() => {
    let res = alleRep;
    if (partiFilter !== 'alle') res = res.filter(r => r.parti?.id === partiFilter);
    if (søk.trim()) {
      const q = søk.toLowerCase();
      res = res.filter(r =>
        `${r.fornavn} ${r.etternavn}`.toLowerCase().includes(q) ||
        (r.fylke?.navn || '').toLowerCase().includes(q)
      );
    }
    return res.sort((a, b) => (a.etternavn || '').localeCompare(b.etternavn || '', 'no'));
  }, [alleRep, søk, partiFilter]);

  return (
    <div className="flex-1 overflow-hidden grid min-h-0" style={{ gridTemplateColumns: valgtRep ? '300px 1fr' : '1fr' }}>
      {/* Venstre: søk + filter + liste */}
      <div className="h-full flex flex-col border-r border-gray-200 bg-white">
        <div className="p-3 border-b border-gray-100 space-y-2 shrink-0">
          <div className="relative">
            <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm">🔍</span>
            <input type="text" placeholder="Søk representant…" value={søk}
              onChange={e => setSøk(e.target.value)}
              className="w-full pl-8 pr-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 bg-gray-50" />
            {søk && (
              <button onClick={() => setSøk('')}
                className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-xs">✕</button>
            )}
          </div>
          <select value={partiFilter} onChange={e => setPartiFilter(e.target.value)}
            className="w-full text-sm border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-300">
            <option value="alle">Alle partier</option>
            {partier.map(([id, navn]) => <option key={id} value={id}>{navn}</option>)}
          </select>
          {data && (
            <p className="text-[11px] text-gray-400 px-1">
              {filtrerte.length} av {alleRep.length} representanter
            </p>
          )}
        </div>
        <div className="flex-1 overflow-y-auto">
          {loading && <Spinner />}
          {error   && <FeilMelding feil={error} />}
          {!loading && !error && filtrerte.length === 0 && (
            <TomtResultat tekst="Ingen representanter matcher søket" />
          )}
          {filtrerte.map(rep => (
            <RepKort key={rep.id} rep={rep}
              valgt={valgtRep?.id === rep.id}
              onClick={() => setValgtRep(rep)} />
          ))}
        </div>
      </div>
      {/* Høyre: profil */}
      {valgtRep && (
        <div className="h-full overflow-hidden">
          <RepProfil rep={valgtRep} sesjonId={sesjonId} onLukk={() => setValgtRep(null)} />
        </div>
      )}
    </div>
  );
}
