[project]
name = "saksanalyse"
version = "0.1.0"
description = "AI-drevet analyse av norske stortingssaker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "anthropic>=0.43",
    "httpx>=0.28",
    "lxml>=5.3",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: kaller eksterne API-er (Claude, Stortinget) — krever nettverkstilgang og ANTHROPIC_API_KEY",
]

[tool.pyright]
pythonVersion = "3.11"
strict = true
